<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -90 160 110" width="640" height="440"><!-- Notebook frog (Miya's Note mascot), feet at y=0, centre x=0, height ~82 units. Copy the <g id="frog"> into a picture/thumbnail and place it with transform="translate(x y) scale(s)" (mirror: scale(-s s)). Pose by editing: raise an arm (path "arm"), change the mouth, add clothes/props around it (diving suit, helmet, rocket...). Keep the green body #6aa55a, ink outline #1d2b1c, big round white eyes. -->
<g id="frog" stroke="#1d2b1c" stroke-linejoin="round" stroke-linecap="round">
