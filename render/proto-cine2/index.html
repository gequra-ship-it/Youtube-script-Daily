// background stars
srnd(5);const sp=pts(2600,.5,.75,'#cfd8ff');for(let i=0;i<2600;i++){const u=rnd()*2-1,a=rnd()*6.283,q=Math.sqrt(1-u*u);sp.geometry.attributes.position.array.set([q*Math.cos(a)*220,u*220,q*Math.sin(a)*220],i*3)}S1.add(sp);

const grid=new T.LineSegments(gg,new T.LineBasicMaterial({color:'#6f8cff',transparent:true,opacity:0,blending:T.AdditiveBlending,depthWrite:false}));S1.add(grid);
const cam1=new T.PerspectiveCamera(38,W/H,.1,800);cam1.setViewOffset(W,H,-W*.08,0,W,H);

}
// ================= timeline =================
const clk=document.getElementById('clk'),prog=document.getElementById('prog'),dot=document.getElementById('dot'),ph=document.getElementById('ph'),phg=document.getElementById('phg');
let cur=-1;const drv={t(v){if(v===undefined)return cur;cur=v;draw(v);
  const s=Math.max(0,v-1.0);clk.textContent=new Date(s*1000).toISOString().substr(11,12);
  prog.style.width=(v/TOTAL*100)+'%';dot.style.left=(v/TOTAL*100)+'%';
  const q=Math.min(1,v/CH2);pc.style.strokeDashoffset=PL*(1-q);const p=pc.getPointAtLength(PL*q);ph.setAttribute('cx',p.x);ph.setAttribute('cy',p.y);phg.setAttribute('cx',p.x);phg.setAttribute('cy',p.y);}};
const tl=gsap.timeline({paused:true});
tl.fromTo(drv,{t:0},{t:TOTAL,duration:TOTAL,ease:'none',immediateRender:true},0);
tl.fromTo('#fade',{opacity:1},{opacity:0,duration:1.6,ease:'power1.out',immediateRender:false},0.05);
// chapter change: the only real cut — quick dip to black, plot/badge leave, chapter label changes
tl.to('#fade',{opacity:1,duration:.5,ease:'power1.in'},CH2-.5);tl.to('#fade',{opacity:0,duration:.8,ease:'power1.out'},CH2+.05);
tl.to('#plot,#plotlab,#badge',{opacity:0,duration:.5},CH2-.6);
tl.set('#hudL',{innerHTML:'<em>Chapter 2</em> &nbsp;·&nbsp; An alien ocean world'},CH2);
tl.to('#fade',{opacity:1,duration:1.0,ease:'power1.in'},TOTAL-1.0);
// keyword roll + subtitle swap (blur out upward, blur in from below)
U.forEach((u,i)=>{const a=Math.max(.3,u[0]+.15),b=i+1<U.length?U[i+1][0]:TOTAL-.6;
  tl.fromTo('#k'+i,{opacity:0,y:46,filter:'blur(10px)'},{opacity:1,y:0,filter:'blur(0px)',duration:.6,ease:'power3.out',immediateRender:false},a);
  tl.to('#k'+i,{opacity:0,y:-46,filter:'blur(10px)',duration:.4,ease:'power2.in'},b-.15);
  tl.fromTo('#s'+i,{opacity:0,filter:'blur(6px)'},{opacity:1,filter:'blur(0px)',duration:.7,ease:'power2.out',immediateRender:false},a+.25);
  tl.to('#s'+i,{opacity:0,duration:.3},b-.2);
  // log: new line enters at the bottom, earlier lines move up and dim (log resets at the chapter change)
  const ch=u[0]<CH2?0:1;tl.fromTo('#l'+i,{opacity:0,top:720},{opacity:1,top:700,duration:.5,ease:'power2.out',immediateRender:false},a+.5);
  U.forEach((w,j)=>{if(j>i&&(w[0]<CH2?0:1)==ch){const d=j-i;tl.to('#l'+i,{top:700-d*34,opacity:Math.max(.12,1-d*.2),duration:.45,ease:'power2.out'},Math.max(.3,w[0]+.15)+.5)}});
  if(ch==0)tl.to('#l'+i,{opacity:0,duration:.4},CH2-.6);});
BADGES.forEach(([i,b],n)=>{const a=Math.max(.3,U[i][0]+.4),nx=BADGES[n+1],e=nx?Math.max(.3,U[nx[0]][0]+.4):CH2-.6;
  tl.fromTo('#b'+i,{opacity:0,y:18},{opacity:1,y:0,duration:.5,ease:'power2.out',immediateRender:false},a);tl.to('#b'+i,{opacity:0,y:-18,duration:.3},e-.1)});
CAPS.forEach((c,i)=>{tl.fromTo('#c'+i,{opacity:0},{opacity:1,duration:.25,immediateRender:false},c[0]);tl.to('#c'+i,{opacity:0,duration:.2},c[1]-.18)});
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;tl.seek(0);
</script></body></html>
