r thousands of years we watched the stars.", "log": "Millennia of stargazing", "badge": "The stars"}, {"uid": "U004", "t0": 13.383, "t1": 17.106, "sub": "Our destiny, we believed: explore every corner."}, {"uid": "U005", "t0": 17.106, "t1": 20.635, "kw": "Telescopes", "sub": "We built telescopes and launched rockets.", "log": "Telescopes, then rockets", "badge": "The void"}, {"uid": "U006", "t0": 20.635, "t1": 24.829, "kw": "The edge", "sub": "Dreaming of the ultimate edge of existence.", "log": "Dream: the ultimate edge", "badge": "The edge"}, {"uid": "U007", "t0": 24.829, "t1": 30.308, "kw": "But", "sub": "Astrophysics found a truth that shatters it.", "acc": true}, {"uid": "U008", "t0": 30.308, "t1": 35.561, "kw": "A barrier", "sub": "An invisible wall in the laws of reality.", "log": "A cosmic barrier"}, {"uid": "U009", "t0": 35.561, "t1": 39.751, "sub": "We will never escape our cosmic backyard.", "log": "We never escape"}, {"uid": "U010", "t0": 39.751, "t1": 42.045, "sub": "To understand our imprisonment..."}, {"uid": "U011", "t0": 42.045, "t1": 47.637, "sub": "...look at our greatest act of exploration."}, {"uid": "U012", "t0": 47.637, "t1": 53.725, "kw": "Voyager 1", "sub": "Voyager 1, launched in 1977.", "log": "Voyager 1, launched 1977", "badge": "Launched 1977"}, {"uid": "U013", "t0": 53.725, "t1": 58.237, "kw": "38,000 mph", "sub": "Over 38,000 mph for nearly half a century.", "log": "38,000 mph, ~50 years"}, {"uid": "U014", "t0": 58.237, "t1": 63.001, "sub": "Farther than anything humans ever built.", "log": "Farthest human-made object"}, {"uid": "U015", "t0": 63.001, "t1": 67.907, "kw": "Front porch", "sub": "Cosmically, it barely left the front porch.", "acc": true}, {"uid": "U016", "t0": 67.907, "t1": 72.354, "sub": "Still inside the Sun's outer gravitational grip.", "log": "Still in the Sun's grip", "badge": "Sun's grip"}, {"uid": "U017", "t0": 72.354, "t1": 76.412, "sub": "Wandering an endless desert of nothing."}, {"uid": "U018", "t0": 76.412, "t1": 81.677, "kw": "73,000 years", "sub": "Over 73,000 years at its current speed...", "log": "To Proxima: 73,000+ years", "badge": "73,000 years"}, {"uid": "U019", "t0": 81.677, "t1": 86.586, "kw": "Proxima", "sub": "...to reach Proxima Centauri, our nearest star."}, {"uid": "U020", "t0": 86.586, "t1": 89.483, "sub": "Think about that timeframe."}, {"uid": "U021", "t0": 89.483, "t1": 93.973, "sub": "Empires rose and fell..."}, {"uid": "U022", "t0": 93.973, "t1": 97.679, "sub": "...in a small fraction of that time.", "log": "Empires rise and fall faster"}, {"uid": "U023", "t0": 97.679, "t1": 101.592, "sub": "Proxima is merely our next-door neighbor."}, {"uid": "U024", "t0": 101.592, "t1": 104.153, "kw": "4.2 light-years", "sub": "About 4.2 light-years away.", "log": "Proxima: 4.2 light-years", "badge": "4.2 ly"}, {"uid": "U025", "t0": 104.153, "t1": 107.924, "kw": "100,000 ly", "sub": "In a galaxy over 100,000 light-years across.", "log": "Galaxy: 100,000+ ly", "badge": "100,000 ly"}, {"uid": "U026", "t0": 107.924, "t1": 113.474, "sub": "Longer than all of recorded history..."}, {"uid": "U027", "t0": 113.474, "t1": 118.427, "kw": "The edge?", "sub": "How could we ever reach the edge?", "acc": true}, {"uid": "U028", "t0": 118.427, "t1": 124.025, "sub": "Maybe our engines are just too primitive.", "plot": 0.05}, {"uid": "U029", "t0": 124.025, "t1": 130.111, "kw": "Light speed?", "sub": "Future engines might approach light speed.", "plot": 0.1}, {"uid": "U030", "t0": 130.111, "t1": 133.428, "sub": "But physics has a first brutal law.", "plot": 0.12}, {"uid": "U031", "t0": 133.428, "t1": 138.297, "kw": "Einstein", "sub": "Einstein: light speed is not just a speed.", "log": "Einstein's law", "plot": 0.15}, {"uid": "U032", "t0": 138.297, "t1": 142.006, "kw": "Speed limit", "sub": "It is the speed limit of cause and effect.", "log": "The cosmic speed limit", "badge": "Limit", "plot": 0.18, "acc": true}, {"uid": "U033", "t0": 142.006, "t1": 145.18, "kw": "186,000 mi/s", "sub": "About 186,000 miles per second.", "log": "Light: 186,000 mi/s", "badge": "186,000 mi/s", "plot": 0.2}, {"uid": "U034", "t0": 145.18, "t1": 150.471, "sub": "Nothing carries information faster.", "plot": 0.22}, {"uid": "U035", "t0": 150.471, "t1": 154.789, "sub": "Nothing with mass can reach it.", "log": "Mass can never reach it", "plot": 0.25}, {"uid": "U036", "t0": 154.789, "t1": 159.211, "kw": "Faster", "sub": "Push a mass closer to light speed...", "plot": 0.35}, {"uid": "U037", "t0": 159.211, "t1": 165.402, "kw": "More energy", "sub": "Each bit of speed costs more energy.", "log": "Each step costs more", "plot": 0.5}, {"uid": "U038", "t0": 165.402, "t1": 167.92, "kw": "Infinity", "sub": "The total climbs toward infinity.", "log": "Energy climbs to infinity", "badge": "Toward infinity", "plot": 0.75}, {"uid": "U039", "t0": 167.92, "t1": 173.374, "sub": "Light speed itself: infinite energy.", "plot": 0.88}, {"uid": "U040", "t0": 173.374, "t1": 177.101, "sub": "Not enough in all the stars and galaxies...", "plot": 0.92}, {"uid": "U041", "t0": 177.101, "t1": 180.49, "sub": "...and black holes combined...", "plot": 0.95}, {"uid": "U042", "t0": 180.49, "t1": 186.395, "kw": "Door shut", "sub": "...to push one ship to light speed.", "plot": 0.98, "acc": true}, {"uid": "U043", "t0": 186.395, "t1": 190.81, "sub": "Locked behind the bars of sub-light speed.", "log": "Locked below light speed", "badge": "Sub-light", "plot": 1}, {"uid": "U044", "t0": 190.81, "t1": 193.875, "sub": "Even if we could bend reality..."}, {"uid": "U045", "t0": 193.875, "t1": 197.231, "kw": "99.9%", "sub": "...and travel at 99.9% of light speed...", "log": "Even at 99.9% of c", "badge": "99.9% of c"}, {"uid": "U046", "t0": 197.231, "t1": 201.279, "kw": "Scale", "sub": "...the scale of the cosmos mocks us.", "acc": true}, {"uid": "U048", "t0": 224.57, "t1": 226.59, "kw": "Zoom out", "sub": "Zoom out to this level..."}, {"uid": "U049", "t0": 226.59, "t1": 232.01, "kw": "A speck", "sub": "We are a speck of dust in an ocean of silence.", "log": "Less than a speck of dust", "badge": "A speck"}, {"uid": "U050", "t0": 232.01, "t1": 238.332, "sub": "We took comfort in one idea..."}, {"uid": "U051", "t0": 238.332, "t1": 239.948, "kw": "Static", "sub": "The universe, at least, was static.", "log": "Comfort: a static universe", "badge": "Static"}, {"uid": "U052", "t0": 239.948, "t1": 244.79, "sub": "In a still universe, with infinite time..."}, {"uid": "U053", "t0": 244.79, "t1": 248.931, "sub": "...you could cross any distance.", "log": "Any distance, given time"}, {"uid": "U054", "t0": 248.931, "t1": 252.66, "kw": "1929", "sub": "That picture began to fall apart in 1929."}, {"uid": "U055", "t0": 252.66, "t1": 255.685, "kw": "Edwin Hubble", "sub": "Thanks to astronomer Edwin Hubble.", "log": "1929: Edwin Hubble"}, {"uid": "U056", "t0": 255.685, "t1": 259.82, "kw": "100-inch", "sub": "The 100-inch Hooker telescope, Mount Wilson.", "log": "100-inch Hooker telescope"}, {"uid": "U057", "t0": 259.82, "t1": 264.165, "sub": "A pattern that shook science."}, {"uid": "U058", "t0": 264.165, "t1": 268.201, "kw": "Expanding", "sub": "The universe is expanding.", "log": "It is expanding", "badge": "Expanding", "acc": true}, {"uid": "U059", "t0": 268.201, "t1": 273.839, "sub": "Hubble studied light from distant galaxies."}, {"uid": "U060", "t0": 273.839, "t1": 277.752, "kw": "Redshift", "sub": "Their light was shifted toward red.", "log": "Galaxy light shifted red", "badge": "Redshift"}, {"uid": "U061", "t0": 277.752, "t1": 281.473, "sub": "At first it looked like the Doppler effect..."}, {"uid": "U062", "t0": 281.473, "t1": 285.393, "kw": "Doppler?", "sub": "...like a siren racing away."}, {"uid": "U063", "t0": 285.393, "t1": 290.267, "kw": "Farther, faster", "sub": "Farther galaxies seemed faster.", "log": "Farther = faster"}, {"uid": "U064", "t0": 290.267, "t1": 294.878, "sub": "Not random drifting through space."}, {"uid": "U065", "t0": 294.878, "t1": 298.798, "sub": "Galaxies receding from each other everywhere...", "log": "Everything recedes"}, {"uid": "U066", "t0": 298.798, "t1": 302.985, "kw": "Balloon", "sub": "...like dots on an inflating balloon."}, {"uid": "U067", "t0": 302.985, "t1": 306.84, "kw": "Intuition fails", "sub": "Here intuition fails."}, {"uid": "U068", "t0": 306.84, "t1": 311.424, "sub": "Galaxies are not flying like bullets."}, {"uid": "U069", "t0": 311.424, "t1": 315.455, "kw": "Space stretches", "sub": "Space itself is stretching between them.", "log": "Space itself stretches", "badge": "Stretching", "acc": true}, {"uid": "U070", "t0": 315.455, "t1": 320.737, "kw": "Fabric", "sub": "Space is not a stage, but a living fabric."}, {"uid": "U071", "t0": 320.737, "t1": 326.712, "sub": "New cubic light-years keep appearing...", "log": "New space keeps appearing"}, {"uid": "U072", "t0": 326.712, "t1": 331.438, "sub": "...pushing everything apart, every moment."}, {"uid": "U073", "t0": 331.438, "t1": 333.653, "kw": "Hubble's Law", "sub": "This is Hubble's Law.", "log": "Hubble's Law", "badge": "Hubble's Law"}, {"uid": "U074", "t0": 333.653, "t1": 339.369, "kw": "Proportional", "sub": "Recession speed is proportional to distance.", "log": "Speed proportional to distance"}, {"uid": "U076", "t0": 362.403, "t1": 366.729, "kw": "Farther, faster", "sub": "The farther you look, the faster the gap grows.", "log": "Farther = faster", "badge": "Faster"}, {"uid": "U077", "t0": 366.729, "t1": 371.415, "kw": "Connect the dots", "sub": "Connect the dots."}, {"uid": "U078", "t0": 371.415, "t1": 376.919, "kw": "Beats light", "sub": "At some point recession beats light speed.", "log": "Recession passes light speed", "acc": true}, {"uid": "U079", "t0": 376.919, "t1": 381.152, "kw": "14 billion ly", "sub": "About 14 billion light-years from Earth...", "log": "At ~14 billion ly", "badge": "14 billion ly"}, {"uid": "U080", "t0": 381.152, "t1": 384.581, "sub": "...the space between us and those regions..."}, {"uid": "U081", "t0": 384.581, "t1": 388.084, "sub": "...grows faster than 186,000 miles per second."}, {"uid": "U082", "t0": 388.084, "t1": 393.283, "sub": "Space carries them away faster than light.", "log": "Carried off faster than light"}, {"uid": "U083", "t0": 393.283, "t1": 399.08, "kw": "Broken?", "sub": "Does this break Einstein's rule?"}, {"uid": "U084", "t0": 399.08, "t1": 401.526, "kw": "No", "sub": "The answer is no."}, {"uid": "U085", "t0": 401.526, "t1": 407.085, "sub": "Nothing moves through space faster than light...", "log": "Through space: never faster"}, {"uid": "U086", "t0": 407.085, "t1": 411.076, "kw": "Space itself", "sub": "...but space itself can stretch faster.", "acc": true}, {"uid": "U087", "t0": 411.076, "t1": 414.399, "sub": "The most distant galaxies we see..."}, {"uid": "U088", "t0": 414.399, "t1": 420.115, "kw": "Several × c", "sub": "...recede at several times light speed today.", "log": "Several times light speed", "badge": "Several × c"}, {"uid": "U089", "t0": 420.115, "t1": 426.265, "kw": "Treadmill", "sub": "Imagine a treadmill. Your top speed: 10 mph.", "log": "The cosmic treadmill", "badge": "10 mph"}, {"uid": "U090", "t0": 426.265, "t1": 431.177, "kw": "20 mph", "sub": "The belt moves backward at 20 mph...", "badge": "20 mph"}, {"uid": "U091", "t0": 431.177, "t1": 433.428, "kw": "100 mph", "sub": "...then 50, then 100.", "badge": "100 mph"}, {"uid": "U092", "t0": 433.428, "t1": 438.664, "sub": "No matter how hard you run..."}, {"uid": "U093", "t0": 438.664, "t1": 444.579, "sub": "...you are dragged back into the dark.", "log": "Dragged backward"}, {"uid": "U094", "t0": 444.579, "t1": 449.823, "sub": "For light chasing the farthest galaxies..."}, {"uid": "U095", "t0": 449.823, "t1": 453.832, "kw": "Outrun", "sub": "...the treadmill outruns its top speed.", "acc": true}, {"uid": "U096", "t0": 453.832, "t1": 457.505, "sub": "Strangely, light from just beyond that line..."}, {"uid": "U097", "t0": 457.505, "t1": 461.317, "kw": "14 billion ly", "sub": "...the 14-billion-light-year line, can still arrive.", "badge": "14 billion ly"}, {"uid": "U098", "t0": 461.317, "t1": 464.436, "sub": "Because the line slowly moves outward.", "log": "The line moves outward"}, {"uid": "U099", "t0": 464.436, "t1": 468.334, "sub": "The true point of no return lies farther."}, {"uid": "U100", "t0": 468.334, "t1": 473.387, "kw": "16 billion ly", "sub": "About 16 billion ly: the Cosmic Event Horizon.", "log": "Event horizon: ~16 billion ly", "badge": "16 billion ly", "acc": true}, {"uid": "U101", "t0": 473.387, "t1": 479.102, "kw": "Cause & effect", "sub": "Like a black hole's: a boundary of cause and effect."}, {"uid": "U102", "t0": 479.102, "t1": 482.545, "kw": "Cut off", "sub": "Beyond it, galaxies are cut off for good.", "log": "Beyond: cut off for good"}, {"uid": "U103", "t0": 482.545, "t1": 487.119, "sub": "Even light fired toward them now..."}, {"uid": "U104", "t0": 487.119, "t1": 493.479, "kw": "Never arrives", "sub": "...would travel forever and never arrive.", "log": "Light never arrives"}, {"uid": "U105", "t0": 493.479, "t1": 498.487, "sub": "If this seems grim, prepare yourself."}, {"uid": "U106", "t0": 498.487, "t1": 504.234, "kw": "1998", "sub": "In 1998, a stranger truth emerged.", "badge": "1998"}, {"uid": "U107", "t0": 504.234, "t1": 507.506, "sub": "Scientists believed gravity..."}, {"uid": "U108", "t0": 507.506, "t1": 512.961, "kw": "A brake?", "sub": "...was braking the expansion.", "log": "Expected: gravity brakes"}, {"uid": "U109", "t0": 512.961, "t1": 518.094, "sub": "Some thought it might stop, or collapse."}, {"uid": "U110", "t0": 518.094, "t1": 521.769, "kw": "Supernovae", "sub": "Two teams measured Type Ia supernovae...", "log": "Two teams, Type Ia supernovae"}, {"uid": "U111", "t0": 521.769, "t1": 527.412, "sub": "...and found the exact opposite."}, {"uid": "U112", "t0": 527.412, "t1": 532.38, "kw": "Accelerating", "sub": "The expansion is accelerating.", "log": "Expansion is accelerating", "badge": "Accelerating", "acc": true}, {"uid": "U113", "t0": 532.38, "t1": 534.356, "sub": "Something invisible and mysterious..."}, {"uid": "U114", "t0": 534.356, "t1": 539.265, "sub": "...pushes the cosmos apart ever faster."}, {"uid": "U115", "t0": 539.265, "t1": 541.706, "kw": "Dark energy", "sub": "Scientists named it dark energy.", "log": "Named: dark energy", "badge": "Dark energy"}, {"uid": "U116", "t0": 541.706, "t1": 546.058, "sub": "In the simplest model, it does not thin out."}, {"uid": "U117", "t0": 546.058, "t1": 549.977, "sub": "Its density stays the same...", "log": "Constant density"}, {"uid": "U118", "t0": 549.977, "t1": 552.933, "sub": "...so more space means more dark energy."}, {"uid": "U119", "t0": 552.933, "t1": 558.988, "kw": "68%", "sub": "Roughly 68% of the universe's energy.", "log": "68% of all energy", "badge": "68%"}, {"uid": "U120", "t0": 558.988, "t1": 563.073, "sub": "It is winning the tug-of-war with gravity."}, {"uid": "U121", "t0": 563.073, "t1": 568.662, "kw": "Slipping away", "sub": "Galaxies keep slipping past the horizon.", "log": "Galaxies slip past the horizon"}, {"uid": "U122", "t0": 568.662, "t1": 574.184, "sub": "Right now, as you listen."}, {"uid": "U123", "t0": 574.184, "t1": 579.662, "kw": "20,000 / s", "sub": "About 20,000 stars a second become unreachable.", "log": "~20,000 stars every second", "badge": "20,000 per second", "acc": true}, {"uid": "U124", "t0": 579.662, "t1": 582.25, "sub": "They are not dying or exploding."}, {"uid": "U125", "t0": 582.25, "t1": 586.168, "sub": "They are carried off faster than we could follow..."}, {"uid": "U126", "t0": 586.168, "t1": 589.009, "sub": "...cut off from our corner forever."}, {"uid": "U128", "t0": 614.391, "t1": 618.715, "kw": "Anywhere?", "sub": "Many believe we could travel anywhere..."}, {"uid": "U129", "t0": 618.715, "t1": 623.167, "sub": "...inside the observable universe, near light speed."}, {"uid": "U130", "t0": 623.167, "t1": 625.935, "kw": "Misunderstanding", "sub": "A tragic misunderstanding."}, {"uid": "U131", "t0": 625.935, "t1": 630.08, "kw": "See", "sub": "We see light from billions of years ago...", "log": "We can see them..."}, {"uid": "U132", "t0": 630.08, "t1": 632.307, "kw": "Never visit", "sub": "...but we can never visit most of them.", "log": "...but never visit"}, {"uid": "U133", "t0": 632.307, "t1": 637.005, "sub": "That light is a ghost from the past."}, {"uid": "U134", "t0": 637.005, "t1": 642.617, "sub": "By one estimate, a light-speed ship today..."}, {"uid": "U135", "t0": 642.617, "t1": 648.229, "kw": "94%", "sub": "...could never reach about 94% of galaxies.", "log": "~94% out of reach", "badge": "94% lost", "acc": true}, {"uid": "U136", "t0": 648.229, "t1": 652.097, "sub": "They already slipped past the horizon."}, {"uid": "U137", "t0": 652.097, "t1": 653.93, "sub": "Let that sink in."}, {"uid": "U138", "t0": 653.93, "t1": 658.745, "sub": "Even surviving a billion years..."}, {"uid": "U139", "t0": 658.745, "t1": 664.11, "kw": "Off-limits", "sub": "...nearly the entire universe is off-limits.", "log": "Nearly all off-limits"}, {"uid": "U140", "t0": 664.11, "t1": 668.468, "sub": "A gallery of unreachable destinations."}, {"uid": "U141", "t0": 668.468, "t1": 673.999, "kw": "Never touch", "sub": "We can look, but never touch.", "log": "Look, never touch"}, {"uid": "U142", "t0": 673.999, "t1": 677.67, "sub": "Sealed off by the laws of spacetime."}, {"uid": "U143", "t0": 677.67, "t1": 682.941, "kw": "What is left?", "sub": "So what is left for us?"}, {"uid": "U144", "t0": 682.941, "t1": 687.505, "kw": "Local Group", "sub": "Our bound neighborhood: the Local Group.", "log": "Reachable: the Local Group", "badge": "Local Group"}, {"uid": "U145", "t0": 687.505, "t1": 690.977, "kw": "80+ galaxies", "sub": "More than 80 known galaxies.", "log": "80+ known galaxies", "badge": "80+"}, {"uid": "U146", "t0": 690.977, "t1": 695.186, "kw": "Andromeda", "sub": "Dominated by Andromeda and the Milky Way..."}, {"uid": "U147", "t0": 695.186, "t1": 701.081, "sub": "...plus Triangulum and dozens of dwarfs.", "log": "Andromeda, Milky Way, Triangulum"}, {"uid": "U148", "t0": 701.081, "t1": 707.126, "sub": "Gravity holds it together against dark energy.", "log": "Gravity beats dark energy here"}, {"uid": "U149", "t0": 707.126, "t1": 713.283, "kw": "Approaching", "sub": "Andromeda is heading toward us..."}, {"uid": "U150", "t0": 713.283, "t1": 716.326, "kw": "250,000 mph", "sub": "...at about 250,000 miles per hour.", "log": "Andromeda: 250,000 mph", "badge": "250,000 mph"}, {"uid": "U151", "t0": 716.326, "t1": 721.609, "kw": "4.5 billion yrs", "sub": "A collision long predicted in 4.5 billion years..."}, {"uid": "U152", "t0": 721.609, "t1": 726.675, "kw": "Milkdromeda", "sub": "...then a merger: Milkdromeda.", "log": "Merger: Milkdromeda"}, {"uid": "U153", "t0": 726.675, "t1": 730.014, "kw": "2025 study", "sub": "A 2025 study: the odds are less certain..."}, {"uid": "U154", "t0": 730.014, "t1": 734.006, "kw": "Coin flip", "sub": "...about a coin flip within 10 billion years.", "log": "2025: ~50/50 in 10 billion yrs", "badge": "Coin flip"}, {"uid": "U155", "t0": 734.006, "t1": 739.866, "sub": "Either way, the Local Group ends up together..."}, {"uid": "U156", "t0": 739.866, "t1": 745.259, "kw": "Home", "sub": "...our permanent, reachable home.", "acc": true}, {"uid": "U157", "t0": 745.259, "t1": 749.071, "kw": "The edge", "sub": "What does the edge truly mean?"}, {"uid": "U158", "t0": 749.071, "t1": 752.1, "sub": "Not a brick wall in space..."}, {"uid": "U159", "t0": 752.1, "t1": 755.445, "sub": "...where you could touch the void."}, {"uid": "U160", "t0": 755.445, "t1": 760.694, "kw": "Closing in", "sub": "A horizon of cause and effect, closing in.", "log": "The edge: a horizon closing in", "acc": true}, {"uid": "U161", "t0": 760.694, "t1": 765.795, "sub": "Everything outside will be swept beyond it..."}, {"uid": "U162", "t0": 765.795, "t1": 768.944, "sub": "...by the unrelenting expansion of space."}, {"uid": "U163", "t0": 768.944, "t1": 773.968, "kw": "Growing distance", "sub": "An edge made of ever-growing distance."}, {"uid": "U164", "t0": 773.968, "t1": 778.079, "kw": "1 trillion yrs", "sub": "The far future: over a trillion years.", "log": "Over a trillion years ahead", "badge": "1 trillion+ yrs"}, {"uid": "U165", "t0": 778.079, "t1": 780.486, "sub": "As dark energy keeps working..."}, {"uid": "U166", "t0": 780.486, "t1": 785.643, "kw": "Past the horizon", "sub": "...every outside galaxy passes the horizon.", "log": "All outside galaxies gone"}, {"uid": "U167", "t0": 785.643, "t1": 789.547, "sub": "Their light stretched beyond detection."}, {"uid": "U168", "t0": 789.547, "t1": 794.605, "kw": "Dark", "sub": "Milkdromeda's sky turns terrifyingly dark.", "log": "A dark sky", "badge": "Dark", "acc": true}, {"uid": "U169", "t0": 794.605, "t1": 798.291, "sub": "Telescopes in that era..."}, {"uid": "U170", "t0": 798.291, "t1": 802.315, "sub": "...see nothing beyond their home galaxy."}, {"uid": "U171", "t0": 802.315, "t1": 808.474, "kw": "Krauss, Scherrer", "sub": "Krauss and Scherrer imagined those astronomers.", "log": "Krauss & Scherrer"}, {"uid": "U172", "t0": 808.474, "t1": 812.077, "sub": "No sign of galaxies racing away."}, {"uid": "U173", "t0": 812.077, "t1": 816.246, "kw": "Afterglow", "sub": "The cosmic microwave background, the Big Bang's glow..."}, {"uid": "U174", "t0": 816.246, "t1": 822.322, "sub": "...stretched beyond detection.", "log": "Big Bang's glow undetectable"}, {"uid": "U175", "t0": 822.322, "t1": 826.249, "kw": "Static?", "sub": "They might think the universe is static."}, {"uid": "U176", "t0": 826.249, "t1": 829.808, "kw": "Erased", "sub": "The true history erased.", "log": "History erased", "badge": "Erased", "acc": true}, {"uid": "U177", "t0": 829.808, "t1": 835.316, "kw": "Wormholes", "sub": "What about wormholes, Einstein-Rosen bridges?", "badge": "Wormhole"}, {"uid": "U178", "t0": 835.316, "t1": 838.613, "sub": "In theory, links between distant regions."}, {"uid": "U179", "t0": 838.613, "t1": 844.323, "kw": "Shortcut?", "sub": "Could a traveler take such a shortcut?"}, {"uid": "U180", "t0": 844.323, "t1": 848.022, "sub": "The physics presents enormous barriers."}, {"uid": "U181", "t0": 848.022, "t1": 851.644, "sub": "To hold one open..."}, {"uid": "U182", "t0": 851.644, "t1": 854.829, "kw": "Negative energy", "sub": "...you need exotic matter with negative energy.", "badge": "Exotic matter"}, {"uid": "U183", "t0": 854.829, "t1": 859.413, "sub": "Nobody knows how to make it. It may not exist."}, {"uid": "U184", "t0": 859.413, "t1": 864.628, "kw": "Quantum", "sub": "Even then, quantum physics may interfere."}, {"uid": "U185", "t0": 864.628, "t1": 869.15, "sub": "Hawking: quantum fluctuations could build up..."}, {"uid": "U186", "t0": 869.15, "t1": 873.735, "kw": "Destroyed", "sub": "...and destroy the tunnel before use."}, {"uid": "U187", "t0": 873.735, "t1": 876.93, "kw": "Chronology", "sub": "The chronology protection conjecture.", "badge": "Hawking"}, {"uid": "U188", "t0": 876.93, "t1": 882.58, "sub": "No one knows for sure: no quantum gravity theory."}, {"uid": "U189", "t0": 882.58, "t1": 886.309, "sub": "Nature guards its speed limit fiercely."}, {"uid": "U190", "t0": 886.309, "t1": 893.443, "kw": "Warp drive", "sub": "Warp drives? Alcubierre, 1994.", "badge": "Alcubierre 1994"}, {"uid": "U191", "t0": 893.443, "t1": 900.188, "kw": "Warp bubble", "sub": "Contract space ahead, expand it behind."}, {"uid": "U192", "t0": 900.188, "t1": 906.372, "sub": "Inside the bubble, the ship is at rest."}, {"uid": "U193", "t0": 906.372, "t1": 909.09, "sub": "The perfect escape hatch?"}, {"uid": "U194", "t0": 909.09, "t1": 915.125, "sub": "Just as daunting as the wormhole."}, {"uid": "U195", "t0": 915.125, "t1": 918.385, "sub": "Early calculations said a warp bubble needs..."}, {"uid": "U196", "t0": 918.385, "t1": 924.238, "kw": "Jupiter", "sub": "...at least Jupiter's mass-energy, negative.", "badge": "Jupiter's mass-energy"}, {"uid": "U197", "t0": 924.238, "t1": 926.706, "sub": "Later designs lowered that number..."}, {"uid": "U198", "t0": 926.706, "t1": 931.774, "sub": "...but nobody can make negative energy."}, {"uid": "U199", "t0": 931.774, "t1": 937.433, "kw": "2012 study", "sub": "A 2012 study: the bubble sweeps up particles...", "badge": "2012 study"}, {"uid": "U200", "t0": 937.433, "t1": 943.76, "kw": "Snowplow", "sub": "...like a cosmic snowplow."}, {"uid": "U201", "t0": 943.76, "t1": 947.157, "kw": "Blast", "sub": "When it stops, the energy blasts the destination.", "acc": true}, {"uid": "U202", "t0": 947.157, "t1": 951.801, "sub": "Every escape route toward the edge..."}, {"uid": "U203", "t0": 951.801, "t1": 956.38, "kw": "A stone wall", "sub": "...hits a wall of physical impossibility."}, {"uid": "U204", "t0": 956.38, "t1": 961.079, "sub": "Infinite energy of relativity..."}, {"uid": "U205", "t0": 961.079, "t1": 964.343, "sub": "...accelerating expansion..."}, {"uid": "U206", "t0": 964.343, "t1": 969.435, "sub": "...fatal shortcuts: one voice."}, {"uid": "U207", "t0": 969.435, "t1": 973.397, "sub": "Nature is not designed for interstellar nomads."}, {"uid": "U208", "t0": 973.397, "t1": 976.719, "kw": "Trapped", "sub": "We are trapped in our local cosmic cell.", "acc": true}, {"uid": "U209", "t0": 976.719, "t1": 979.627, "sub": "Push the question further."}, {"uid": "U210", "t0": 979.627, "t1": 985.509, "kw": "Teleport", "sub": "Teleport to the edge of the observable universe?"}, {"uid": "U211", "t0": 985.509, "t1": 988.823, "sub": "What would you see? A wall of darkness?"}, {"uid": "U212", "t0": 988.823, "t1": 992.339, "sub": "A boundary where space ends?"}, {"uid": "U213", "t0": 992.339, "t1": 995.449, "sub": "Cosmology's answer bends the mind."}, {"uid": "U214", "t0": 995.449, "t1": 998.649, "kw": "46 billion ly", "sub": "Teleported 46 billion light-years away...", "badge": "46 billion ly"}, {"uid": "U215", "t0": 998.649, "t1": 1003.823, "kw": "Your own bubble", "sub": "...you'd be at the center of your own bubble."}, {"uid": "U216", "t0": 1003.823, "t1": 1010.116, "sub": "Space would continue in every direction."}, {"uid": "U217", "t0": 1010.116, "t1": 1013.585, "kw": "Beach ball", "sub": "Think of an ant on a beach ball.", "badge": "Curved?"}, {"uid": "U218", "t0": 1013.585, "t1": 1018.083, "sub": "It walks forever and never meets an edge."}, {"uid": "U219", "t0": 1018.083, "t1": 1023.573, "kw": "No boundary", "sub": "Finite, yet with no boundary."}, {"uid": "U220", "t0": 1023.573, "t1": 1029.477, "sub": "Our universe might be curved like that."}, {"uid": "U221", "t0": 1029.477, "t1": 1032.921, "sub": "Travel straight for an unimaginable distance..."}, {"uid": "U222", "t0": 1032.921, "t1": 1038.249, "kw": "Back to start", "sub": "...and you'd return to where you started."}, {"uid": "U223", "t0": 1038.249, "t1": 1045.363, "kw": "Flat", "sub": "Planck shows the universe is remarkably flat.", "badge": "Flat"}, {"uid": "U224", "t0": 1045.363, "t1": 1050.065, "sub": "If space is flat, with no unusual shape..."}, {"uid": "U225", "t0": 1050.065, "t1": 1053.827, "kw": "Forever", "sub": "...the simplest conclusion: it goes on forever."}, {"uid": "U226", "t0": 1053.827, "t1": 1057.806, "sub": "Infinite volume, endless galaxies."}, {"uid": "U227", "t0": 1057.806, "t1": 1063.417, "kw": "No edge", "sub": "Then a physical edge does not even exist.", "acc": true}, {"uid": "U228", "t0": 1063.417, "t1": 1069.135, "sub": "The irony: if infinite, no edge to reach."}, {"uid": "U229", "t0": 1069.135, "t1": 1071.952, "sub": "Even if there were an edge..."}, {"uid": "U230", "t0": 1071.952, "t1": 1077.705, "sub": "...expansion means we could never catch it."}, {"uid": "U231", "t0": 1077.705, "t1": 1082.662, "kw": "Phantom edge", "sub": "A phantom edge, retreating faster than light.", "acc": true}, {"uid": "U232", "t0": 1082.662, "t1": 1085.808, "sub": "Every step forward is dwarfed..."}, {"uid": "U233", "t0": 1085.808, "t1": 1089.289, "sub": "...by new space opening ahead."}, {"uid": "U234", "t0": 1089.289, "t1": 1094.106, "sub": "Look at the vast voids that exist today."}, {"uid": "U235", "t0": 1094.106, "t1": 1100.369, "kw": "Boötes Void", "sub": "The Boötes Void: 250-330 million ly across.", "log": "Boötes Void: 250-330 million ly"}, {"uid": "U236", "t0": 1100.369, "t1": 1105.482, "kw": "60 galaxies", "sub": "Only about 60 known galaxies inside.", "log": "Only ~60 galaxies", "badge": "~60"}, {"uid": "U237", "t0": 1105.482, "t1": 1110.95, "sub": "A desert of emptiness. Greg Aldering noted..."}, {"uid": "U238", "t0": 1110.95, "t1": 1114.605, "sub": "...if the Milky Way sat at its center..."}, {"uid": "U239", "t0": 1114.605, "t1": 1119.783, "kw": "1960s", "sub": "...we'd not have known of other galaxies until the 1960s.", "log": "Unknown galaxies until the 1960s"}, {"uid": "U240", "t0": 1119.783, "t1": 1122.075, "sub": "As dark energy keeps working..."}, {"uid": "U241", "t0": 1122.075, "t1": 1127.977, "kw": "Emptier", "sub": "...our sky will be emptier than any void today.", "acc": true}, {"uid": "U242", "t0": 1127.977, "t1": 1133.218, "kw": "Shoreline", "sub": "Picture a cosmic shoreline.", "log": "A cosmic shoreline"}, {"uid": "U243", "t0": 1133.218, "t1": 1139.446, "sub": "Islands drifting over the horizon. The tide rises."}, {"uid": "U244", "t0": 1139.446, "t1": 1144.454, "sub": "Washing away the bridges of light."}, {"uid": "U245", "t0": 1144.454, "t1": 1150.365, "sub": "The shore recedes, cutting off our island..."}, {"uid": "U246", "t0": 1150.365, "t1": 1152.803, "sub": "...and no technology can stop it.", "log": "No technology can stop it"}, {"uid": "U247", "t0": 1152.803, "t1": 1155.284, "sub": "Even without expansion...", "badge": "Stelliferous", "plot": 1}, {"uid": "U248", "t0": 1155.284, "t1": 1161.119, "kw": "Entropy", "sub": "...a second executioner: entropy.", "log": "Second executioner: entropy", "plot": 1}, {"uid": "U249", "t0": 1161.119, "t1": 1165.061, "sub": "The second law of thermodynamics:", "plot": 0.97}, {"uid": "U250", "t0": 1165.061, "t1": 1170.954, "sub": "usable energy keeps running down. Stars age.", "log": "Usable energy runs down", "plot": 0.95}, {"uid": "U251", "t0": 1170.954, "t1": 1174.383, "sub": "Star-forming gas will run out...", "plot": 0.9}, {"uid": "U252", "t0": 1174.383, "t1": 1179.198, "kw": "100 trillion yrs", "sub": "...star formation ends in ~100 trillion years.", "log": "Star birth ends: ~100 trillion yrs", "plot": 0.85}, {"uid": "U253", "t0": 1179.198, "t1": 1182.696, "sub": "Crossing the cosmos takes immense energy...", "plot": 0.82}, {"uid": "U254", "t0": 1182.696, "t1": 1188.781, "sub": "...and the clock is always ticking.", "plot": 0.8}, {"uid": "U255", "t0": 1188.781, "t1": 1193.008, "sub": "In the deep future, long before any arrival...", "plot": 0.75}, {"uid": "U256", "t0": 1193.008, "t1": 1198.294, "kw": "Burn out", "sub": "...starlight ends. Suns burn out.", "plot": 0.65}, {"uid": "U257", "t0": 1198.294, "t1": 1202.644, "kw": "Red dwarfs", "sub": "Red dwarfs fade over trillions of years.", "log": "Red dwarfs fade", "plot": 0.55}, {"uid": "U258", "t0": 1202.644, "t1": 1207.662, "kw": "Degenerate Era", "sub": "Then the Degenerate Era.", "log": "The Degenerate Era", "badge": "Degenerate", "plot": 0.45, "acc": true}, {"uid": "U259", "t0": 1207.662, "t1": 1212.044, "sub": "White dwarfs, neutron stars, black holes.", "plot": 0.42}, {"uid": "U260", "t0": 1212.044, "t1": 1215.218, "sub": "Travel becomes a voyage...", "plot": 0.4}, {"uid": "U261", "t0": 1215.218, "t1": 1219.261, "sub": "...through a graveyard in total darkness.", "plot": 0.38}, {"uid": "U262", "t0": 1219.261, "t1": 1223.02, "kw": "10^40 years", "sub": "After 10^40 years, even protons...", "plot": 0.3}, {"uid": "U263", "t0": 1223.02, "t1": 1225.715, "sub": "...the building blocks of nuclei...", "plot": 0.28}, {"uid": "U264", "t0": 1225.715, "t1": 1229.261, "kw": "Decay?", "sub": "...may decay, if protons decay at all.", "log": "Protons may decay", "plot": 0.25}, {"uid": "U265", "t0": 1229.261, "t1": 1234.965, "sub": "Never observed. If so, solid matter ends.", "plot": 0.22}, {"uid": "U266", "t0": 1234.965, "t1": 1239.049, "sub": "Ships, planets, bones and steel dissolve.", "plot": 0.2}, {"uid": "U267", "t0": 1239.049, "t1": 1245.105, "kw": "Black holes", "sub": "Only black holes remain. They too are doomed.", "badge": "Black Hole Era", "plot": 0.17}, {"uid": "U268", "t0": 1245.105, "t1": 1248.997, "sub": "The slow leak of Hawking radiation...", "plot": 0.14}, {"uid": "U269", "t0": 1248.997, "t1": 1253.03, "kw": "10^100 years", "sub": "...over something like 10^100 years...", "plot": 0.1}, {"uid": "U270", "t0": 1253.03, "t1": 1257.559, "sub": "...evaporates even the largest black holes.", "log": "Black holes evaporate", "plot": 0.06}, {"uid": "U271", "t0": 1257.559, "t1": 1260.082, "sub": "Leaving almost nothing.", "plot": 0.04}, {"uid": "U272", "t0": 1260.082, "t1": 1263.359, "kw": "Heat death", "sub": "The final state: the heat death...", "log": "Heat death / Big Freeze", "badge": "Heat death", "plot": 0.02, "acc": true}, {"uid": "U273", "t0": 1263.359, "t1": 1267.656, "sub": "...the Big Freeze, one leading scenario.", "plot": 0.02}, {"uid": "U274", "t0": 1267.656, "t1": 1269.768, "sub": "A thin, even soup...", "plot": 0.01}, {"uid": "U275", "t0": 1269.768, "t1": 1275.374, "sub": "...of very low-energy particles.", "plot": 0.01}, {"uid": "U276", "t0": 1275.374, "t1": 1280.424, "kw": "Near zero", "sub": "A tiny fraction above absolute zero.", "plot": 0}, {"uid": "U277", "t0": 1280.424, "t1": 1284.935, "sub": "Time loses meaning: nothing changes...", "plot": 0}, {"uid": "U278", "t0": 1284.935, "t1": 1288.647, "sub": "...nothing moves, no work can be done.", "plot": 0}, {"uid": "U279", "t0": 1288.647, "t1": 1293.447, "sub": "Not a violent crash...", "plot": 0}, {"uid": "U280", "t0": 1293.447, "t1": 1297.703, "kw": "Silence", "sub": "...but a silent whisper, forever.", "plot": 0}, {"uid": "U281", "t0": 1297.703, "t1": 1303.886, "sub": "Together these truths deliver a shock."}, {"uid": "U282", "t0": 1303.886, "t1": 1307.718, "sub": "We are not masters of an infinite playground."}, {"uid": "U283", "t0": 1307.718, "t1": 1312.942, "kw": "Prisoners", "sub": "We are prisoners of physics on a grain of sand...", "badge": "A grain of sand"}, {"uid": "U284", "t0": 1312.942, "t1": 1314.842, "sub": "...in one isolated island of galaxies."}, {"uid": "U285", "t0": 1314.842, "t1": 1319.722, "sub": "The universe does not care about our dreams..."}, {"uid": "U286", "t0": 1319.722, "t1": 1322.975, "sub": "...or what lies beyond the veil."}, {"uid": "U287", "t0": 1322.975, "t1": 1326.098, "sub": "Its laws pull reality apart..."}, {"uid": "U288", "t0": 1326.098, "t1": 1330.097, "sub": "...faster than light can bridge."}, {"uid": "U289", "t0": 1330.097, "t1": 1332.323, "sub": "Yet, paradoxically..."}, {"uid": "U290", "t0": 1332.323, "t1": 1337.432, "kw": "A privilege", "sub": "...this reveals a privilege of our era.", "acc": true}, {"uid": "U291", "t0": 1337.432, "t1": 1341.278, "kw": "Golden age", "sub": "We live in a golden age of cosmology.", "badge": "Golden age"}, {"uid": "U292", "t0": 1341.278, "t1": 1347.19, "kw": "A window", "sub": "A narrow window: old enough for elements..."}, {"uid": "U293", "t0": 1347.19, "t1": 1352.973, "sub": "...planets and minds, young enough to see galaxies..."}, {"uid": "U294", "t0": 1352.973, "t1": 1357.035, "sub": "...and the cosmic microwave background."}, {"uid": "U295", "t0": 1357.035, "t1": 1360.293, "kw": "100 billion yrs", "sub": "Had we appeared 100 billion years later..."}, {"uid": "U296", "t0": 1360.293, "t1": 1363.841, "sub": "...the sky would be almost empty of galaxies."}, {"uid": "U297", "t0": 1363.841, "t1": 1366.868, "sub": "Scientists might never have known..."}, {"uid": "U298", "t0": 1366.868, "t1": 1370.346, "sub": "...about expansion or the Big Bang."}, {"uid": "U299", "t0": 1370.346, "t1": 1374.943, "kw": "Now", "sub": "Trapped in lonely darkness. But we live now.", "acc": true}, {"uid": "U300", "t0": 1374.943, "t1": 1381.132, "kw": "The shutters", "sub": "We look through the window before it closes."}, {"uid": "U301", "t0": 1381.132, "t1": 1384.742, "sub": "Witnesses of a disappearing masterpiece."}, {"uid": "U302", "t0": 1384.742, "t1": 1388.049, "kw": "Responsibility", "sub": "A great responsibility for human minds."}, {"uid": "U303", "t0": 1388.049, "t1": 1392.299, "sub": "Rare observers who can record..."}, {"uid": "U304", "t0": 1392.299, "t1": 1396.155, "sub": "...reality's true architecture before it fades."}, {"uid": "U305", "t0": 1396.155, "t1": 1399.292, "sub": "Every galaxy mapped, every spectrum measured..."}, {"uid": "U306", "t0": 1399.292, "t1": 1404.716, "kw": "Defiance", "sub": "...is defiance against cosmic forgetting."}, {"uid": "U307", "t0": 1404.716, "t1": 1408.64, "sub": "We write down the story of expansion..."}, {"uid": "U308", "t0": 1408.64, "t1": 1412.833, "sub": "...that future civilizations may never see."}, {"uid": "U309", "t0": 1412.833, "t1": 1418.199, "kw": "Make peace", "sub": "We can never reach the edge. We make peace.", "badge": "Our home"}, {"uid": "U310", "t0": 1418.199, "t1": 1421.924, "sub": "Not a place for flags and footprints."}, {"uid": "U311", "t0": 1421.924, "t1": 1426.849, "sub": "A horizon enforced by light and dark energy."}, {"uid": "U312", "t0": 1426.849, "t1": 1432.468, "kw": "Elevates", "sub": "Accepting it elevates the human spirit."}, {"uid": "U313", "t0": 1432.468, "t1": 1434.758, "sub": "Our local realm..."}, {"uid": "U314", "t0": 1434.758, "t1": 1441.329, "kw": "Precious", "sub": "...hundreds of billions of suns, precious.", "acc": true}, {"uid": "U315", "t0": 1441.329, "t1": 1446.291, "kw": "Billions of suns", "sub": "Hundreds of billions of star systems..."}, {"uid": "U316", "t0": 1446.291, "t1": 1451.954, "sub": "...planets, moons, hidden oceans, unknown worlds."}, {"uid": "U317", "t0": 1451.954, "t1": 1454.433, "sub": "Even without leaving our cell..."}, {"uid": "U318", "t0": 1454.433, "t1": 1459.527, "kw": "Generations", "sub": "...room to explore for millions of generations."}, {"uid": "U319", "t0": 1459.527, "t1": 1465.056, "sub": "Purpose, beauty and discovery need no edge."}, {"uid": "U320", "t0": 1465.056, "t1": 1470.443, "kw": "Vast garden", "sub": "Our garden is vast beyond imagination."}, {"uid": "U321", "t0": 1470.443, "t1": 1475.377, "kw": "The real mystery", "sub": "The real mystery is not the locked regions.", "badge": "A pale blue dot"}, {"uid": "U322", "t0": 1475.377, "t1": 1479.83, "sub": "It is that we, fragile stardust..."}, {"uid": "U323", "t0": 1479.83, "t1": 1482.646, "kw": "Pale blue dot", "sub": "...on a pale blue dot..."}, {"uid": "U324", "t0": 1482.646, "t1": 1486.248, "sub": "...can look out into the void..."}, {"uid": "U325", "t0": 1486.248, "t1": 1490.309, "kw": "Understand", "sub": "...and understand the laws that bind us.", "acc": true}, {"uid": "U326", "t0": 1490.309, "t1": 1492.918, "sub": "Through mathematics, physics and reason..."}, {"uid": "U327", "t0": 1492.918, "t1": 1497.915, "sub": "...the universe can contemplate its bounds."}, {"uid": "U328", "t0": 1497.915, "t1": 1501.138, "kw": "Stardust", "sub": "Calcium in your bones, iron in your blood...", "badge": "Stardust"}, {"uid": "U329", "t0": 1501.138, "t1": 1507.077, "kw": "Forged in stars", "sub": "...oxygen: forged in long-dead stars."}, {"uid": "U330", "t0": 1507.077, "t1": 1511.463, "sub": "You are not separate from the cosmos."}, {"uid": "U331", "t0": 1511.463, "t1": 1515.1, "kw": "From within", "sub": "You are the cosmos experiencing itself.", "acc": true}, {"uid": "U332", "t0": 1515.1, "t1": 1520.963, "sub": "The universe waking up to see itself..."}, {"uid": "U333", "t0": 1520.963, "t1": 1524.918, "sub": "...and the prison walls lose their sting."}, {"uid": "U334", "t0": 1524.918, "t1": 1529.767, "kw": "A clear night", "sub": "Next clear night, gaze up into the silence...", "badge": "Keep looking up"}, {"uid": "U335",
