g": "Dream: the ultimate edge", "badge": "The edge"}, {"uid": "U007", "t0": 24.829, "t1": 30.308, "kw": "But", "sub": "Astrophysics found a truth that shatters it.", "acc": true}, {"uid": "U008", "t0": 30.308, "t1": 35.561, "kw": "A barrier", "sub": "An invisible wall in the laws of reality.", "log": "A cosmic barrier"}, {"uid": "U009", "t0": 35.561, "t1": 40.151, "sub": "We will never escape our cosmic backyard.", "log": "We never escape"}, {"uid": "U010", "t0": 40.151, "t1": 42.445, "sub": "To understand our imprisonment..."}, {"uid": "U011", "t0": 42.445, "t1": 48.037, "sub": "...look at our greatest act of exploration."}, {"uid": "U012", "t0": 48.037, "t1": 54.125, "kw": "Voyager 1", "sub": "Voyager 1, launched in 1977.", "log": "Voyager 1, launched 1977", "badge": "Launched 1977"}, {"uid": "U013", "t0": 54.125, "t1": 58.637, "kw": "38,000 mph", "sub": "Over 38,000 mph for nearly half a century.", "log": "38,000 mph, ~50 years"}, {"uid": "U014", "t0": 58.637, "t1": 63.401, "sub": "Farther than anything humans ever built.", "log": "Farthest human-made object"}, {"uid": "U015", "t0": 63.401, "t1": 68.307, "kw": "Front porch", "sub": "Cosmically, it barely left the front porch.", "acc": true}, {"uid": "U016", "t0": 68.307, "t1": 72.754, "sub": "Still inside the Sun's outer gravitational grip.", "log": "Still in the Sun's grip", "badge": "Sun's grip"}, {"uid": "U017", "t0": 72.754, "t1": 77.212, "sub": "Wandering an endless desert of nothing."}, {"uid": "U018", "t0": 77.212, "t1": 82.477, "kw": "73,000 years", "sub": "Over 73,000 years at its current speed...", "log": "To Proxima: 73,000+ years", "badge": "73,000 years"}, {"uid": "U019", "t0": 82.477, "t1": 87.386, "kw": "Proxima", "sub": "...to reach Proxima Centauri, our nearest star."}, {"uid": "U020", "t0": 87.386, "t1": 90.283, "sub": "Think about that timeframe."}, {"uid": "U021", "t0": 90.283, "t1": 94.773, "sub": "Empires rose and fell..."}, {"uid": "U022", "t0": 94.773, "t1": 98.479, "sub": "...in a small fraction of that time.", "log": "Empires rise and fall faster"}, {"uid": "U023", "t0": 98.479, "t1": 102.392, "sub": "Proxima is merely our next-door neighbor."}, {"uid": "U024", "t0": 102.392, "t1": 104.953, "kw": "4.2 light-years", "sub": "About 4.2 light-years away.", "log": "Proxima: 4.2 light-years", "badge": "4.2 ly"}, {"uid": "U025", "t0": 104.953, "t1": 108.724, "kw": "100,000 ly", "sub": "In a galaxy over 100,000 light-years across.", "log": "Galaxy: 100,000+ ly", "badge": "100,000 ly"}, {"uid": "U026", "t0": 108.724, "t1": 114.274, "sub": "Longer than all of recorded history..."}, {"uid": "U027", "t0": 114.274, "t1": 119.627, "kw": "The edge?", "sub": "How could we ever reach the edge?", "acc": true}, {"uid": "U028", "t0": 119.627, "t1": 125.225, "sub": "Maybe our engines are just too primitive.", "plot": 0.05}, {"uid": "U029", "t0": 125.225, "t1": 131.311, "kw": "Light speed?", "sub": "Future engines might approach light speed.", "plot": 0.1}, {"uid": "U030", "t0": 131.311, "t1": 134.628, "sub": "But physics has a first brutal law.", "plot": 0.12}, {"uid": "U031", "t0": 134.628, "t1": 139.497, "kw": "Einstein", "sub": "Einstein: light speed is not just a speed.", "log": "Einstein's law", "plot": 0.15}, {"uid": "U032", "t0": 139.497, "t1": 143.206, "kw": "Speed limit", "sub": "It is the speed limit of cause and effect.", "log": "The cosmic speed limit", "badge": "Limit", "plot": 0.18, "acc": true}, {"uid": "U033", "t0": 143.206, "t1": 146.38, "kw": "186,000 mi/s", "sub": "About 186,000 miles per second.", "log": "Light: 186,000 mi/s", "badge": "186,000 mi/s", "plot": 0.2}, {"uid": "U034", "t0": 146.38, "t1": 151.671, "sub": "Nothing carries information faster.", "plot": 0.22}, {"uid": "U035", "t0": 151.671, "t1": 156.389, "sub": "Nothing with mass can reach it.", "log": "Mass can never reach it", "plot": 0.25}, {"uid": "U036", "t0": 156.389, "t1": 160.811, "kw": "Faster", "sub": "Push a mass closer to light speed...", "plot": 0.35}, {"uid": "U037", "t0": 160.811, "t1": 167.002, "kw": "More energy", "sub": "Each bit of speed costs more energy.", "log": "Each step costs more", "plot": 0.5}, {"uid": "U038", "t0": 167.002, "t1": 169.52, "kw": "Infinity", "sub": "The total climbs toward infinity.", "log": "Energy climbs to infinity", "badge": "Toward infinity", "plot": 0.75}, {"uid": "U039", "t0": 169.52, "t1": 174.974, "sub": "Light speed itself: infinite energy.", "plot": 0.88}, {"uid": "U040", "t0": 174.974, "t1": 178.701, "sub": "Not enough in all the stars and galaxies...", "plot": 0.92}, {"uid": "U041", "t0": 178.701, "t1": 182.09, "sub": "...and black holes combined...", "plot": 0.95}, {"uid": "U042", "t0": 182.09, "t1": 187.995, "kw": "Door shut", "sub": "...to push one ship to light speed.", "plot": 0.98, "acc": true}, {"uid": "U043", "t0": 187.995, "t1": 192.81, "sub": "Locked behind the bars of sub-light speed.", "log": "Locked below light speed", "badge": "Sub-light", "plot": 1}, {"uid": "U044", "t0": 192.81, "t1": 195.875, "sub": "Even if we could bend reality..."}, {"uid": "U045", "t0": 195.875, "t1": 199.231, "kw": "99.9%", "sub": "...and travel at 99.9% of light speed...", "log": "Even at 99.9% of c", "badge": "99.9% of c"}, {"uid": "U046", "t0": 199.231, "t1": 203.679, "kw": "Scale", "sub": "...the scale of the cosmos mocks us.", "acc": true}, {"uid": "U048", "t0": 227.37, "t1": 229.39, "kw": "Zoom out", "sub": "Zoom out to this level..."}, {"uid": "U049", "t0": 229.39, "t1": 235.21, "kw": "A speck", "sub": "We are a speck of dust in an ocean of silence.", "log": "Less than a speck of dust", "badge": "A speck"}, {"uid": "U050", "t0": 235.21, "t1": 241.532, "sub": "We took comfort in one idea..."}, {"uid": "U051", "t0": 241.532, "t1": 243.148, "kw": "Static", "sub": "The universe, at least, was static.", "log": "Comfort: a static universe", "badge": "Static"}, {"uid": "U052", "t0": 243.148, "t1": 247.99, "sub": "In a still universe, with infinite time..."}, {"uid": "U053", "t0": 247.99, "t1": 252.131, "sub": "...you could cross any distance.", "log": "Any distance, given time"}, {"uid": "U054", "t0": 252.131, "t1": 255.86, "kw": "1929", "sub": "That picture began to fall apart in 1929."}, {"uid": "U055", "t0": 255.86, "t1": 258.885, "kw": "Edwin Hubble", "sub": "Thanks to astronomer Edwin Hubble.", "log": "1929: Edwin Hubble"}, {"uid": "U056", "t0": 258.885, "t1": 263.02, "kw": "100-inch", "sub": "The 100-inch Hooker telescope, Mount Wilson.", "log": "100-inch Hooker telescope"}, {"uid": "U057", "t0": 263.02, "t1": 267.365, "sub": "A pattern that shook science."}, {"uid": "U058", "t0": 267.365, "t1": 271.801, "kw": "Expanding", "sub": "The universe is expanding.", "log": "It is expanding", "badge": "Expanding", "acc": true}, {"uid": "U059", "t0": 271.801, "t1": 277.439, "sub": "Hubble studied light from distant galaxies."}, {"uid": "U060", "t0": 277.439, "t1": 281.352, "kw": "Redshift", "sub": "Their light was shifted toward red.", "log": "Galaxy light shifted red", "badge": "Redshift"}, {"uid": "U061", "t0": 281.352, "t1": 285.073, "sub": "At first it looked like the Doppler effect..."}, {"uid": "U062", "t0": 285.073, "t1": 288.993, "kw": "Doppler?", "sub": "...like a siren racing away."}, {"uid": "U063", "t0": 288.993, "t1": 293.867, "kw": "Farther, faster", "sub": "Farther galaxies seemed faster.", "log": "Farther = faster"}, {"uid": "U064", "t0": 293.867, "t1": 298.478, "sub": "Not random drifting through space."}, {"uid": "U065", "t0": 298.478, "t1": 302.398, "sub": "Galaxies receding from each other everywhere...", "log": "Everything recedes"}, {"uid": "U066", "t0": 302.398, "t1": 306.985, "kw": "Balloon", "sub": "...like dots on an inflating balloon."}, {"uid": "U067", "t0": 306.985, "t1": 310.84, "kw": "Intuition fails", "sub": "Here intuition fails."}, {"uid": "U068", "t0": 310.84, "t1": 315.424, "sub": "Galaxies are not flying like bullets."}, {"uid": "U069", "t0": 315.424, "t1": 319.455, "kw": "Space stretches", "sub": "Space itself is stretching between them.", "log": "Space itself stretches", "badge": "Stretching", "acc": true}, {"uid": "U070", "t0": 319.455, "t1": 324.737, "kw": "Fabric", "sub": "Space is not a stage, but a living fabric."}, {"uid": "U071", "t0": 324.737, "t1": 330.712, "sub": "New cubic light-years keep appearing...", "log": "New space keeps appearing"}, {"uid": "U072", "t0": 330.712, "t1": 335.838, "sub": "...pushing everything apart, every moment."}, {"uid": "U073", "t0": 335.838, "t1": 338.053, "kw": "Hubble's Law", "sub": "This is Hubble's Law.", "log": "Hubble's Law", "badge": "Hubble's Law"}, {"uid": "U074", "t0": 338.053, "t1": 344.169, "kw": "Proportional", "sub": "Recession speed is proportional to distance.", "log": "Speed proportional to distance"}, {"uid": "U076", "t0": 367.603, "t1": 372.329, "kw": "Farther, faster", "sub": "The farther you look, the faster the gap grows.", "log": "Farther = faster", "badge": "Faster"}, {"uid": "U077", "t0": 372.329, "t1": 377.015, "kw": "Connect the dots", "sub": "Connect the dots."}, {"uid": "U078", "t0": 377.015, "t1": 382.519, "kw": "Beats light", "sub": "At some point recession beats light speed.", "log": "Recession passes light speed", "acc": true}, {"uid": "U079", "t0": 382.519, "t1": 386.752, "kw": "14 billion ly", "sub": "About 14 billion light-years from Earth...", "log": "At ~14 billion ly", "badge": "14 billion ly"}, {"uid": "U080", "t0": 386.752, "t1": 390.181, "sub": "...the space between us and those regions..."}, {"uid": "U081", "t0": 390.181, "t1": 393.684, "sub": "...grows faster than 186,000 miles per second."}, {"uid": "U082", "t0": 393.684, "t1": 399.283, "sub": "Space carries them away faster than light.", "log": "Carried off faster than light"}, {"uid": "U083", "t0": 399.283, "t1": 405.08, "kw": "Broken?", "sub": "Does this break Einstein's rule?"}, {"uid": "U084", "t0": 405.08, "t1": 407.526, "kw": "No", "sub": "The answer is no."}, {"uid": "U085", "t0": 407.526, "t1": 413.085, "sub": "Nothing moves through space faster than light...", "log": "Through space: never faster"}, {"uid": "U086", "t0": 413.085, "t1": 417.076, "kw": "Space itself", "sub": "...but space itself can stretch faster.", "acc": true}, {"uid": "U087", "t0": 417.076, "t1": 420.399, "sub": "The most distant galaxies we see..."}, {"uid": "U088", "t0": 420.399, "t1": 426.515, "kw": "Several × c", "sub": "...recede at several times light speed today.", "log": "Several times light speed", "badge": "Several × c"}, {"uid": "U089", "t0": 426.515, "t1": 432.665, "kw": "Treadmill", "sub": "Imagine a treadmill. Your top speed: 10 mph.", "log": "The cosmic treadmill", "badge": "10 mph"}, {"uid": "U090", "t0": 432.665, "t1": 437.577, "kw": "20 mph", "sub": "The belt moves backward at 20 mph...", "badge": "20 mph"}, {"uid": "U091", "t0": 437.577, "t1": 439.828, "kw": "100 mph", "sub": "...then 50, then 100.", "badge": "100 mph"}, {"uid": "U092", "t0": 439.828, "t1": 445.064, "sub": "No matter how hard you run..."}, {"uid": "U093", "t0": 445.064, "t1": 450.979, "sub": "...you are dragged back into the dark.", "log": "Dragged backward"}, {"uid": "U094", "t0": 450.979, "t1": 456.223, "sub": "For light chasing the farthest galaxies..."}, {"uid": "U095", "t0": 456.223, "t1": 460.632, "kw": "Outrun", "sub": "...the treadmill outruns its top speed.", "acc": true}, {"uid": "U096", "t0": 460.632, "t1": 464.305, "sub": "Strangely, light from just beyond that line..."}, {"uid": "U097", "t0": 464.305, "t1": 468.117, "kw": "14 billion ly", "sub": "...the 14-billion-light-year line, can still arrive.", "badge": "14 billion ly"}, {"uid": "U098", "t0": 468.117, "t1": 471.236, "sub": "Because the line slowly moves outward.", "log": "The line moves outward"}, {"uid": "U099", "t0": 471.236, "t1": 475.134, "sub": "The true point of no return lies farther."}, {"uid": "U100", "t0": 475.134, "t1": 480.187, "kw": "16 billion ly", "sub": "About 16 billion ly: the Cosmic Event Horizon.", "log": "Event horizon: ~16 billion ly", "badge": "16 billion ly", "acc": true}, {"uid": "U101", "t0": 480.187, "t1": 485.902, "kw": "Cause & effect", "sub": "Like a black hole's: a boundary of cause and effect."}, {"uid": "U102", "t0": 485.902, "t1": 489.345, "kw": "Cut off", "sub": "Beyond it, galaxies are cut off for good.", "log": "Beyond: cut off for good"}, {"uid": "U103", "t0": 489.345, "t1": 493.919, "sub": "Even light fired toward them now..."}, {"uid": "U104", "t0": 493.919, "t1": 500.679, "kw": "Never arrives", "sub": "...would travel forever and never arrive.", "log": "Light never arrives"}, {"uid": "U105", "t0": 500.679, "t1": 505.687, "sub": "If this seems grim, prepare yourself."}, {"uid": "U106", "t0": 505.687, "t1": 511.434, "kw": "1998", "sub": "In 1998, a stranger truth emerged.", "badge": "1998"}, {"uid": "U107", "t0": 511.434, "t1": 514.706, "sub": "Scientists believed gravity..."}, {"uid": "U108", "t0": 514.706, "t1": 520.161, "kw": "A brake?", "sub": "...was braking the expansion.", "log": "Expected: gravity brakes"}, {"uid": "U109", "t0": 520.161, "t1": 525.294, "sub": "Some thought it might stop, or collapse."}, {"uid": "U110", "t0": 525.294, "t1": 528.969, "kw": "Supernovae", "sub": "Two teams measured Type Ia supernovae...", "log": "Two teams, Type Ia supernovae"}, {"uid": "U111", "t0": 528.969, "t1": 534.612, "sub": "...and found the exact opposite."}, {"uid": "U112", "t0": 534.612, "t1": 539.98, "kw": "Accelerating", "sub": "The expansion is accelerating.", "log": "Expansion is accelerating", "badge": "Accelerating", "acc": true}, {"uid": "U113", "t0": 539.98, "t1": 541.956, "sub": "Something invisible and mysterious..."}, {"uid": "U114", "t0": 541.956, "t1": 546.865, "sub": "...pushes the cosmos apart ever faster."}, {"uid": "U115", "t0": 546.865, "t1": 549.306, "kw": "Dark energy", "sub": "Scientists named it dark energy.", "log": "Named: dark energy", "badge": "Dark energy"}, {"uid": "U116", "t0": 549.306, "t1": 553.658, "sub": "In the simplest model, it does not thin out."}, {"uid": "U117", "t0": 553.658, "t1": 557.577, "sub": "Its density stays the same...", "log": "Constant density"}, {"uid": "U118", "t0": 557.577, "t1": 560.533, "sub": "...so more space means more dark energy."}, {"uid": "U119", "t0": 560.533, "t1": 566.588, "kw": "68%", "sub": "Roughly 68% of the universe's energy.", "log": "68% of all energy", "badge": "68%"}, {"uid": "U120", "t0": 566.588, "t1": 571.073, "sub": "It is winning the tug-of-war with gravity."}, {"uid": "U121", "t0": 571.073, "t1": 576.662, "kw": "Slipping away", "sub": "Galaxies keep slipping past the horizon.", "log": "Galaxies slip past the horizon"}, {"uid": "U122", "t0": 576.662, "t1": 582.184, "sub": "Right now, as you listen."}, {"uid": "U123", "t0": 582.184, "t1": 587.662, "kw": "20,000 / s", "sub": "About 20,000 stars a second become unreachable.", "log": "~20,000 stars every second", "badge": "20,000 per second", "acc": true}, {"uid": "U124", "t0": 587.662, "t1": 590.25, "sub": "They are not dying or exploding."}, {"uid": "U125", "t0": 590.25, "t1": 594.168, "sub": "They are carried off faster than we could follow..."}, {"uid": "U126", "t0": 594.168, "t1": 597.409, "sub": "...cut off from our corner forever."}, {"uid": "U128", "t0": 623.191, "t1": 627.515, "kw": "Anywhere?", "sub": "Many believe we could travel anywhere..."}, {"uid": "U129", "t0": 627.515, "t1": 631.967, "sub": "...inside the observable universe, near light speed."}, {"uid": "U130", "t0": 631.967, "t1": 634.735, "kw": "Misunderstanding", "sub": "A tragic misunderstanding."}, {"uid": "U131", "t0": 634.735, "t1": 638.88, "kw": "See", "sub": "We see light from billions of years ago...", "log": "We can see them..."}, {"uid": "U132", "t0": 638.88, "t1": 641.107, "kw": "Never visit", "sub": "...but we can never visit most of them.", "log": "...but never visit"}, {"uid": "U133", "t0": 641.107, "t1": 645.805, "sub": "That light is a ghost from the past."}, {"uid": "U134", "t0": 645.805, "t1": 651.417, "sub": "By one estimate, a light-speed ship today..."}, {"uid": "U135", "t0": 651.417, "t1": 657.029, "kw": "94%", "sub": "...could never reach about 94% of galaxies.", "log": "~94% out of reach", "badge": "94% lost", "acc": true}, {"uid": "U136", "t0": 657.029, "t1": 661.297, "sub": "They already slipped past the horizon."}, {"uid": "U137", "t0": 661.297, "t1": 663.13, "sub": "Let that sink in."}, {"uid": "U138", "t0": 663.13, "t1": 667.945, "sub": "Even surviving a billion years..."}, {"uid": "U139", "t0": 667.945, "t1": 673.31, "kw": "Off-limits", "sub": "...nearly the entire universe is off-limits.", "log": "Nearly all off-limits"}, {"uid": "U140", "t0": 673.31, "t1": 677.668, "sub": "A gallery of unreachable destinations."}, {"uid": "U141", "t0": 677.668, "t1": 683.199, "kw": "Never touch", "sub": "We can look, but never touch.", "log": "Look, never touch"}, {"uid": "U142", "t0": 683.199, "t1": 687.27, "sub": "Sealed off by the laws of spacetime."}, {"uid": "U143", "t0": 687.27, "t1": 692.541, "kw": "What is left?", "sub": "So what is left for us?"}, {"uid": "U144", "t0": 692.541, "t1": 697.105, "kw": "Local Group", "sub": "Our bound neighborhood: the Local Group.", "log": "Reachable: the Local Group", "badge": "Local Group"}, {"uid": "U145", "t0": 697.105, "t1": 700.577, "kw": "80+ galaxies", "sub": "More than 80 known galaxies.", "log": "80+ known galaxies", "badge": "80+"}, {"uid": "U146", "t0": 700.577, "t1": 704.786, "kw": "Andromeda", "sub": "Dominated by Andromeda and the Milky Way..."}, {"uid": "U147", "t0": 704.786, "t1": 710.681, "sub": "...plus Triangulum and dozens of dwarfs.", "log": "Andromeda, Milky Way, Triangulum"}, {"uid": "U148", "t0": 710.681, "t1": 717.126, "sub": "Gravity holds it together against dark energy.", "log": "Gravity beats dark energy here"}, {"uid": "U149", "t0": 717.126, "t1": 723.283, "kw": "Approaching", "sub": "Andromeda is heading toward us..."}, {"uid": "U150", "t0": 723.283, "t1": 726.326, "kw": "250,000 mph", "sub": "...at about 250,000 miles per hour.", "log": "Andromeda: 250,000 mph", "badge": "250,000 mph"}, {"uid": "U151", "t0": 726.326, "t1": 731.609, "kw": "4.5 billion yrs", "sub": "A collision long predicted in 4.5 billion years..."}, {"uid": "U152", "t0": 731.609, "t1": 736.675, "kw": "Milkdromeda", "sub": "...then a merger: Milkdromeda.", "log": "Merger: Milkdromeda"}, {"uid": "U153", "t0": 736.675, "t1": 740.014, "kw": "2025 study", "sub": "A 2025 study: the odds are less certain..."}, {"uid": "U154", "t0": 740.014, "t1": 744.006, "kw": "Coin flip", "sub": "...about a coin flip within 10 billion years.", "log": "2025: ~50/50 in 10 billion yrs", "badge": "Coin flip"}, {"uid": "U155", "t0": 744.006, "t1": 749.866, "sub": "Either way, the Local Group ends up together..."}, {"uid": "U156", "t0": 749.866, "t1": 755.659, "kw": "Home", "sub": "...our permanent, reachable home.", "acc": true}, {"uid": "U157", "t0": 755.659, "t1": 759.471, "kw": "The edge", "sub": "What does the edge truly mean?"}, {"uid": "U158", "t0": 759.471, "t1": 762.5, "sub": "Not a brick wall in space..."}, {"uid": "U159", "t0": 762.5, "t1": 765.845, "sub": "...where you could touch the void."}, {"uid": "U160", "t0": 765.845, "t1": 771.094, "kw": "Closing in", "sub": "A horizon of cause and effect, closing in.", "log": "The edge: a horizon closing in", "acc": true}, {"uid": "U161", "t0": 771.094, "t1": 776.195, "sub": "Everything outside will be swept beyond it..."}, {"uid": "U162", "t0": 776.195, "t1": 779.344, "sub": "...by the unrelenting expansion of space."}, {"uid": "U163", "t0": 779.344, "t1": 784.768, "kw": "Growing distance", "sub": "An edge made of ever-growing distance."}, {"uid": "U164", "t0": 784.768, "t1": 788.879, "kw": "1 trillion yrs", "sub": "The far future: over a trillion years.", "log": "Over a trillion years ahead", "badge": "1 trillion+ yrs"}, {"uid": "U165", "t0": 788.879, "t1": 791.286, "sub": "As dark energy keeps working..."}, {"uid": "U166", "t0": 791.286, "t1": 796.443, "kw": "Past the horizon", "sub": "...every outside galaxy passes the horizon.", "log": "All outside galaxies gone"}, {"uid": "U167", "t0": 796.443, "t1": 800.347, "sub": "Their light stretched beyond detection."}, {"uid": "U168", "t0": 800.347, "t1": 805.405, "kw": "Dark", "sub": "Milkdromeda's sky turns terrifyingly dark.", "log": "A dark sky", "badge": "Dark", "acc": true}, {"uid": "U169", "t0": 805.405, "t1": 809.091, "sub": "Telescopes in that era..."}, {"uid": "U170", "t0": 809.091, "t1": 813.515, "sub": "...see nothing beyond their home galaxy."}, {"uid": "U171", "t0": 813.515, "t1": 819.674, "kw": "Krauss, Scherrer", "sub": "Krauss and Scherrer imagined those astronomers.", "log": "Krauss & Scherrer"}, {"uid": "U172", "t0": 819.674, "t1": 823.277, "sub": "No sign of galaxies racing away."}, {"uid": "U173", "t0": 823.277, "t1": 827.446, "kw": "Afterglow", "sub": "The cosmic microwave background, the Big Bang's glow..."}, {"uid": "U174", "t0": 827.446, "t1": 833.522, "sub": "...stretched beyond detection.", "log": "Big Bang's glow undetectable"}, {"uid": "U175", "t0": 833.522, "t1": 837.449, "kw": "Static?", "sub": "They might think the universe is static."}, {"uid": "U176", "t0": 837.449, "t1": 841.408, "kw": "Erased", "sub": "The true history erased.", "log": "History erased", "badge": "Erased", "acc": true}, {"uid": "U177", "t0": 841.408, "t1": 846.916, "kw": "Wormholes", "sub": "What about wormholes, Einstein-Rosen bridges?", "badge": "Wormhole"}, {"uid": "U178", "t0": 846.916, "t1": 850.213, "sub": "In theory, links between distant regions."}, {"uid": "U179", "t0": 850.213, "t1": 855.923, "kw": "Shortcut?", "sub": "Could a traveler take such a shortcut?"}, {"uid": "U180", "t0": 855.923, "t1": 859.622, "sub": "The physics presents enormous barriers."}, {"uid": "U181", "t0": 859.622, "t1": 863.244, "sub": "To hold one open..."}, {"uid": "U182", "t0": 863.244, "t1": 866.429, "kw": "Negative energy", "sub": "...you need exotic matter with negative energy.", "badge": "Exotic matter"}, {"uid": "U183", "t0": 866.429, "t1": 871.413, "sub": "Nobody knows how to make it. It may not exist."}, {"uid": "U184", "t0": 871.413, "t1": 876.628, "kw": "Quantum", "sub": "Even then, quantum physics may interfere."}, {"uid": "U185", "t0": 876.628, "t1": 881.15, "sub": "Hawking: quantum fluctuations could build up..."}, {"uid": "U186", "t0": 881.15, "t1": 885.735, "kw": "Destroyed", "sub": "...and destroy the tunnel before use."}, {"uid": "U187", "t0": 885.735, "t1": 888.93, "kw": "Chronology", "sub": "The chronology protection conjecture.", "badge": "Hawking"}, {"uid": "U188", "t0": 888.93, "t1": 894.58, "sub": "No one knows for sure: no quantum gravity theory."}, {"uid": "U189", "t0": 894.58, "t1": 898.709, "sub": "Nature guards its speed limit fiercely."}, {"uid": "U190", "t0": 898.709, "t1": 905.843, "kw": "Warp drive", "sub": "Warp drives? Alcubierre, 1994.", "badge": "Alcubierre 1994"}, {"uid": "U191", "t0": 905.843, "t1": 912.588, "kw": "Warp bubble", "sub": "Contract space ahead, expand it behind."}, {"uid": "U192", "t0": 912.588, "t1": 918.772, "sub": "Inside the bubble, the ship is at rest."}, {"uid": "U193", "t0": 918.772, "t1": 921.49, "sub": "The perfect escape hatch?"}, {"uid": "U194", "t0": 921.49, "t1": 927.925, "sub": "Just as daunting as the wormhole."}, {"uid": "U195", "t0": 927.925, "t1": 931.185, "sub": "Early calculations said a warp bubble needs..."}, {"uid": "U196", "t0": 931.185, "t1": 937.038, "kw": "Jupiter", "sub": "...at least Jupiter's mass-energy, negative.", "badge": "Jupiter's mass-energy"}, {"uid": "U197", "t0": 937.038, "t1": 939.506, "sub": "Later designs lowered that number..."}, {"uid": "U198", "t0": 939.506, "t1": 944.574, "sub": "...but nobody can make negative energy."}, {"uid": "U199", "t0": 944.574, "t1": 950.233, "kw": "2012 study", "sub": "A 2012 study: the bubble sweeps up particles...", "badge": "2012 study"}, {"uid": "U200", "t0": 950.233, "t1": 956.56, "kw": "Snowplow", "sub": "...like a cosmic snowplow."}, {"uid": "U201", "t0": 956.56, "t1": 960.357, "kw": "Blast", "sub": "When it stops, the energy blasts the destination.", "acc": true}, {"uid": "U202", "t0": 960.357, "t1": 965.001, "sub": "Every escape route toward the edge..."}, {"uid": "U203", "t0": 965.001, "t1": 969.58, "kw": "A stone wall", "sub": "...hits a wall of physical impossibility."}, {"uid": "U204", "t0": 969.58, "t1": 974.279, "sub": "Infinite energy of relativity..."}, {"uid": "U205", "t0": 974.279, "t1": 977.543, "sub": "...accelerating expansion..."}, {"uid": "U206", "t0": 977.543, "t1": 982.635, "sub": "...fatal shortcuts: one voice."}, {"uid": "U207", "t0": 982.635, "t1": 986.597, "sub": "Nature is not designed for interstellar nomads."}, {"uid": "U208", "t0": 986.597, "t1": 990.319, "kw": "Trapped", "sub": "We are trapped in our local cosmic cell.", "acc": true}, {"uid": "U209", "t0": 990.319, "t1": 993.227, "sub": "Push the question further."}, {"uid": "U210", "t0": 993.227, "t1": 999.109, "kw": "Teleport", "sub": "Teleport to the edge of the observable universe?"}, {"uid": "U211", "t0": 999.109, "t1": 1002.423, "sub": "What would you see? A wall of darkness?"}, {"uid": "U212", "t0": 1002.423, "t1": 1005.939, "sub": "A boundary where space ends?"}, {"uid": "U213", "t0": 1005.939, "t1": 1009.049, "sub": "Cosmology's answer bends the mind."}, {"uid": "U214", "t0": 1009.049, "t1": 1012.249, "kw": "46 billion ly", "sub": "Teleported 46 billion light-years away...", "badge": "46 billion ly"}, {"uid": "U215", "t0": 1012.249, "t1": 1017.423, "kw": "Your own bubble", "sub": "...you'd be at the center of your own bubble."}, {"uid": "U216", "t0": 1017.423, "t1": 1024.116, "sub": "Space would continue in every direction."}, {"uid": "U217", "t0": 1024.116, "t1": 1027.585, "kw": "Beach ball", "sub": "Think of an ant on a beach ball.", "badge": "Curved?"}, {"uid": "U218", "t0": 1027.585, "t1": 1032.083, "sub": "It walks forever and never meets an edge."}, {"uid": "U219", "t0": 1032.083, "t1": 1037.573, "kw": "No boundary", "sub": "Finite, yet with no boundary."}, {"uid": "U220", "t0": 1037.573, "t1": 1043.477, "sub": "Our universe might be curved like that."}, {"uid": "U221", "t0": 1043.477, "t1": 1046.921, "sub": "Travel straight for an unimaginable distance..."}, {"uid": "U222", "t0": 1046.921, "t1": 1052.649, "kw": "Back to start", "sub": "...and you'd return to where you started."}, {"uid": "U223", "t0": 1052.649, "t1": 1059.763, "kw": "Flat", "sub": "Planck shows the universe is remarkably flat.", "badge": "Flat"}, {"uid": "U224", "t0": 1059.763, "t1": 1064.465, "sub": "If space is flat, with no unusual shape..."}, {"uid": "U225", "t0": 1064.465, "t1": 1068.227, "kw": "Forever", "sub": "...the simplest conclusion: it goes on forever."}, {"uid": "U226", "t0": 1068.227, "t1": 1072.206, "sub": "Infinite volume, endless galaxies."}, {"uid": "U227", "t0": 1072.206, "t1": 1078.217, "kw": "No edge", "sub": "Then a physical edge does not even exist.", "acc": true}, {"uid": "U228", "t0": 1078.217, "t1": 1083.935, "sub": "The irony: if infinite, no edge to reach."}, {"uid": "U229", "t0": 1083.935, "t1": 1086.752, "sub": "Even if there were an edge..."}, {"uid": "U230", "t0": 1086.752, "t1": 1092.505, "sub": "...expansion means we could never catch it."}, {"uid": "U231", "t0": 1092.505, "t1": 1097.462, "kw": "Phantom edge", "sub": "A phantom edge, retreating faster than light.", "acc": true}, {"uid": "U232", "t0": 1097.462, "t1": 1100.608, "sub": "Every step forward is dwarfed..."}, {"uid": "U233", "t0": 1100.608, "t1": 1104.489, "sub": "...by new space opening ahead."}, {"uid": "U234", "t0": 1104.489, "t1": 1109.306, "sub": "Look at the vast voids that exist today."}, {"uid": "U235", "t0": 1109.306, "t1": 1115.569, "kw": "Boötes Void", "sub": "The Boötes Void: 250-330 million ly across.", "log": "Boötes Void: 250-330 million ly"}, {"uid": "U236", "t0": 1115.569, "t1": 1120.682, "kw": "60 galaxies", "sub": "Only about 60 known galaxies inside.", "log": "Only ~60 galaxies", "badge": "~60"}, {"uid": "U237", "t0": 1120.682, "t1": 1126.15, "sub": "A desert of emptiness. Greg Aldering noted..."}, {"uid": "U238", "t0": 1126.15, "t1": 1129.805, "sub": "...if the Milky Way sat at its center..."}, {"uid": "U239", "t0": 1129.805, "t1": 1134.983, "kw": "1960s", "sub": "...we'd not have known of other galaxies until the 1960s.", "log": "Unknown galaxies until the 1960s"}, {"uid": "U240", "t0": 1134.983, "t1": 1137.275, "sub": "As dark energy keeps working..."}, {"uid": "U241", "t0": 1137.275, "t1": 1143.577, "kw": "Emptier", "sub": "...our sky will be emptier than any void today.", "acc": true}, {"uid": "U242", "t0": 1143.577, "t1": 1148.818, "kw": "Shoreline", "sub": "Picture a cosmic shoreline.", "log": "A cosmic shoreline"}, {"uid": "U243", "t0": 1148.818, "t1": 1155.046, "sub": "Islands drifting over the horizon. The tide rises."}, {"uid": "U244", "t0": 1155.046, "t1": 1160.054, "sub": "Washing away the bridges of light."}, {"uid": "U245", "t0": 1160.054, "t1": 1165.965, "sub": "The shore recedes, cutting off our island..."}, {"uid": "U246", "t0": 1165.965, "t1": 1168.803, "sub": "...and no technology can stop it.", "log": "No technology can stop it"}, {"uid": "U247", "t0": 1168.803, "t1": 1171.284, "sub": "Even without expansion...", "badge": "Stelliferous", "plot": 1}, {"uid": "U248", "t0": 1171.284, "t1": 1177.119, "kw": "Entropy", "sub": "...a second executioner: entropy.", "log": "Second executioner: entropy", "plot": 1}, {"uid": "U249", "t0": 1177.119, "t1": 1181.061, "sub": "The second law of thermodynamics:", "plot": 0.97}, {"uid": "U250", "t0": 1181.061, "t1": 1186.954, "sub": "usable energy keeps running down. Stars age.", "log": "Usable energy runs down", "plot": 0.95}, {"uid": "U251", "t0": 1186.954, "t1": 1190.383, "sub": "Star-forming gas will run out...", "plot": 0.9}, {"uid": "U252", "t0": 1190.383, "t1": 1195.198, "kw": "100 trillion yrs", "sub": "...star formation ends in ~100 trillion years.", "log": "Star birth ends: ~100 trillion yrs", "plot": 0.85}, {"uid": "U253", "t0": 1195.198, "t1": 1198.696, "sub": "Crossing the cosmos takes immense energy...", "plot": 0.82}, {"uid": "U254", "t0": 1198.696, "t1": 1205.181, "sub": "...and the clock is always ticking.", "plot": 0.8}, {"uid": "U255", "t0": 1205.181, "t1": 1209.408, "sub": "In the deep future, long before any arrival...", "plot": 0.75}, {"uid": "U256", "t0": 1209.408, "t1": 1214.694, "kw": "Burn out", "sub": "...starlight ends. Suns burn out.", "plot": 0.65}, {"uid": "U257", "t0": 1214.694, "t1": 1219.044, "kw": "Red dwarfs", "sub": "Red dwarfs fade over trillions of years.", "log": "Red dwarfs fade", "plot": 0.55}, {"uid": "U258", "t0": 1219.044, "t1": 1224.062, "kw": "Degenerate Era", "sub": "Then the Degenerate Era.", "log": "The Degenerate Era", "badge": "Degenerate", "plot": 0.45, "acc": true}, {"uid": "U259", "t0": 1224.062, "t1": 1228.444, "sub": "White dwarfs, neutron stars, black holes.", "plot": 0.42}, {"uid": "U260", "t0": 1228.444, "t1": 1231.618, "sub": "Travel becomes a voyage...", "plot": 0.4}, {"uid": "U261", "t0": 1231.618, "t1": 1236.061, "sub": "...through a graveyard in total darkness.", "plot": 0.38}, {"uid": "U262", "t0": 1236.061, "t1": 1239.82, "kw": "10^40 years", "sub": "After 10^40 years, even protons...", "plot": 0.3}, {"uid": "U263", "t0": 1239.82, "t1": 1242.515, "sub": "...the building blocks of nuclei...", "plot": 0.28}, {"uid": "U264", "t0": 1242.515, "t1": 1246.061, "kw": "Decay?", "sub": "...may decay, if protons decay at all.", "log": "Protons may decay", "plot": 0.25}, {"uid": "U265", "t0": 1246.061, "t1": 1251.765, "sub": "Never observed. If so, solid matter ends.", "plot": 0.22}, {"uid": "U266", "t0": 1251.765, "t1": 1255.849, "sub": "Ships, planets, bones and steel dissolve.", "plot": 0.2}, {"uid": "U267", "t0": 1255.849, "t1": 1261.905, "kw": "Black holes", "sub": "Only black holes remain. They too are doomed.", "badge": "Black Hole Era", "plot": 0.17}, {"uid": "U268", "t0": 1261.905, "t1": 1265.797, "sub": "The slow leak of Hawking radiation...", "plot": 0.14}, {"uid": "U269", "t0": 1265.797, "t1": 1269.83, "kw": "10^100 years", "sub": "...over something like 10^100 years...", "plot": 0.1}, {"uid": "U270", "t0": 1269.83, "t1": 1274.359, "sub": "...evaporates even the largest black holes.", "log": "Black holes evaporate", "plot": 0.06}, {"uid": "U271", "t0": 1274.359, "t1": 1277.282, "sub": "Leaving almost nothing.", "plot": 0.04}, {"uid": "U272", "t0": 1277.282, "t1": 1280.559, "kw": "Heat death", "sub": "The final state: the heat death...", "log": "Heat death / Big Freeze", "badge": "Heat death", "plot": 0.02, "acc": true}, {"uid": "U273", "t0": 1280.559, "t1": 1284.856, "sub": "...the Big Freeze, one leading scenario.", "plot": 0.02}, {"uid": "U274", "t0": 1284.856, "t1": 1286.968, "sub": "A thin, even soup...", "plot": 0.01}, {"uid": "U275", "t0": 1286.968, "t1": 1292.574, "sub": "...of very low-energy particles.", "plot": 0.01}, {"uid": "U276", "t0": 1292.574, "t1": 1297.624, "kw": "Near zero", "sub": "A tiny fraction above absolute zero.", "plot": 0}, {"uid": "U277", "t0": 1297.624, "t1": 1302.135, "sub": "Time loses meaning: nothing changes...", "plot": 0}, {"uid": "U278", "t0": 1302.135, "t1": 1305.847, "sub": "...nothing moves, no work can be done.", "plot": 0}, {"uid": "U279", "t0": 1305.847, "t1": 1310.647, "sub": "Not a violent crash...", "plot": 0}, {"uid": "U280", "t0": 1310.647, "t1": 1315.303, "kw": "Silence", "sub": "...but a silent whisper, forever.", "plot": 0}, {"uid": "U281", "t0": 1315.303, "t1": 1321.486, "sub": "Together these truths deliver a shock."}, {"uid": "U282", "t0": 1321.486, "t1": 1325.318, "sub": "We are not masters of an infinite playground."}, {"uid": "U283", "t0": 1325.318, "t1": 1330.542, "kw": "Prisoners", "sub": "We are prisoners of physics on a grain of sand...", "badge": "A grain of sand"}, {"uid": "U284", "t0": 1330.542, "t1": 1332.442, "sub": "...in one isolated island of galaxies."}, {"uid": "U285", "t0": 1332.442, "t1": 1337.322, "sub": "The universe does not care about our dreams..."}, {"uid": "U286", "t0": 1337.322, "t1": 1340.575, "sub": "...or what lies beyond the veil."}, {"uid": "U287", "t0": 1340.575, "t1": 1343.698, "sub": "Its laws pull reality apart..."}, {"uid": "U288", "t0": 1343.698, "t1": 1348.097, "sub": "...faster than light can bridge."}, {"uid": "U289", "t0": 1348.097, "t1": 1350.323, "sub": "Yet, paradoxically..."}, {"uid": "U290", "t0": 1350.323, "t1": 1355.432, "kw": "A privilege", "sub": "...this reveals a privilege of our era.", "acc": true}, {"uid": "U291", "t0": 1355.432, "t1": 1359.278, "kw": "Golden age", "sub": "We live in a golden age of cosmology.", "badge": "Golden age"}, {"uid": "U292", "t0": 1359.278, "t1": 1365.19, "kw": "A window", "sub": "A narrow window: old enough for elements..."}, {"uid": "U293", "t0": 1365.19, "t1": 1370.973, "sub": "...planets and minds, young enough to see galaxies..."}, {"uid": "U294", "t0": 1370.973, "t1": 1375.435, "sub": "...and the cosmic microwave background."}, {"uid": "U295", "t0": 1375.435, "t1": 1378.693, "kw": "100 billion yrs", "sub": "Had we appeared 100 billion years later..."}, {"uid": "U296", "t0": 1378.693, "t1": 1382.241, "sub": "...the sky would be almost empty of galaxies."}, {"uid": "U297", "t0": 1382.241, "t1": 1385.268, "sub": "Scientists might never have known..."}, {"uid": "U298", "t0": 1385.268, "t1": 1388.746, "sub": "...about expansion or the Big Bang."}, {"uid": "U299", "t0": 1388.746, "t1": 1393.343, "kw": "Now", "sub": "Trapped in lonely darkness. But we live now.", "acc": true}, {"uid": "U300", "t0": 1393.343, "t1": 1399.532, "kw": "The shutters", "sub": "We look through the window before it closes."}, {"uid": "U301", "t0": 1399.532, "t1": 1403.542, "sub": "Witnesses of a disappearing masterpiece."}, {"uid": "U302", "t0": 1403.542, "t1": 1406.849, "kw": "Responsibility", "sub": "A great responsibility for human minds."}, {"uid": "U303", "t0": 1406.849, "t1": 1411.099, "sub": "Rare observers who can record..."}, {"uid": "U304", "t0": 1411.099, "t1": 1414.955, "sub": "...reality's true architecture before it fades."}, {"uid": "U305", "t0": 1414.955, "t1": 1418.092, "sub": "Every galaxy mapped, every spectrum measured..."}, {"uid": "U306", "t0": 1418.092, "t1": 1423.516, "kw": "Defiance", "sub": "...is defiance against cosmic forgetting."}, {"uid": "U307", "t0": 1423.516, "t1": 1427.44, "sub": "We write down the story of expansion..."}, {"uid": "U308", "t0": 1427.44, "t1": 1432.033, "sub": "...that future civilizations may never see."}, {"uid": "U309", "t0": 1432.033, "t1": 1437.399, "kw": "Make peace", "sub": "We can never reach the edge. We make peace.", "badge": "Our home"}, {"uid": "U310", "t0": 1437.399, "t1": 1441.124, "sub": "Not a place for flags and footprints."}, {"uid": "U311", "t0": 1441.124, "t1": 1446.049, "sub": "A horizon enforced by light and dark energy."}, {"uid": "U312", "t0": 1446.049, "t1": 1451.668, "kw": "Elevates", "sub": "Accepting it elevates the human spirit."}, {"uid": "U313", "t0": 1451.668, "t1": 1453.958, "sub": "Our local realm..."}, {"uid": "U314", "t0": 1453.958, "t1": 1460.929, "kw": "Precious", "sub": "...hundreds of billions of suns, precious.", "acc": true}, {"uid": "U315", "t0": 1460.929, "t1": 1465.891, "kw": "Billions of suns", "sub": "Hundreds of billions of star systems..."}, {"uid": "U316", "t0": 1465.891, "t1": 1471.554, "sub": "...planets, moons, hidden oceans, unknown worlds."}, {"uid": "U317", "t0": 1471.554, "t1": 1474.033, "sub": "Even without leaving our cell..."}, {"uid": "U318", "t0": 1474.033, "t1": 1479.127, "kw": "Generations", "sub": "...room to explore for millions of generations."}, {"uid": "U319", "t0": 1479.127, "t1": 1484.656, "sub": "Purpose, beauty and discovery need no edge."}, {"uid": "U320", "t0": 1484.656, "t1": 1490.443, "kw": "Vast garden", "sub": "Our garden is vast beyond imagination."}, {"uid": "U321", "t0": 1490.443, "t1": 1495.377, "kw": "The real mystery", "sub": "The real mystery is not the locked regions.", "badge": "A pale blue dot"}, {"uid": "U322", "t0": 1495.377, "t1": 1499.83, "sub": "It is that we, fragile stardust..."}, {"uid": "U323", "t0": 1499.83, "t1": 1502.646, "kw": "Pale blue dot", "sub": "...on a pale blue dot..."}, {"uid": "U324", "t0": 1502.646, "t1": 1506.248, "sub": "...can look out into the void..."}, {"uid": "U325", "t0": 1506.248, "t1": 1510.309, "kw": "Understand", "sub": "...and understand the laws that bind us.", "acc": true}, {"uid": "U326", "t0": 1510.309, "t1": 1512.918, "sub": "Through mathematics, physics and reason..."}, {"uid": "U327", "t0": 1512.918, "t1": 1518.315, "sub": "...the universe can contemplate its bounds."}, {"uid": "U328", "t0": 1518.315, "t1": 1521.538, "kw": "Stardust", "sub": "Calcium in your bones, iron in your blood...", "badge": "Stardust"}, {"uid": "U329", "t0": 1521.538, "t1": 1527.477, "kw": "Forged in stars", "sub": "...oxygen: forged in long-dead stars."}, {"uid": "U330", "t0": 1527.477, "t1": 1531.863, "sub": "You are not separate from the cosmos."}, {"uid": "U331", "t0": 1531.863, "t1": 1535.5, "kw": "From within", "sub": "You are the cosmos experiencing itself.", "acc": true}, {"uid": "U332", "t0": 1535.5, "t1": 1541.363, "sub": "The universe waking up to see itself..."}, {"uid": "U333", "t0": 1541.363, "t1": 1545.718, "sub": "...and the prison walls lose their sting."}, {"uid": "U334", "t0": 1545.718, "t1": 1550.567, "kw": "A clear night", "sub": "Next clear night, gaze up into the silence...", "badge": "Keep looking up"}, {"uid": "U335", "t0": 1550.567, "t1": 1555.477, "sub": "...with humility and awe."}, {"uid": "U336", "t0": 1555.477, "t1": 1559.925, "sub": "Do not mourn the unreachable edge."}, {"uid": "U337", "t0": 1559.925, "t1": 1563.897, "sub": "Marvel instead, in this brief..."}, {"uid": "U338", "t0": 1563.897, "t1": 1566.194, "kw": "We are here", "sub": "...precious second, we are here..."}, {"uid": "U339", "t0": 1566.194, "t1": 1573.078, "sub": "...alive, seeing a vanishing world's light."}, {"uid": "U340",
