<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=1920, height=1080">
<script src="gsap.min.js"></script><script src="three.js"></script><script src="room-env.js"></script>
<style>@font-face{font-family:Fredoka;src:url(Fredoka-700.woff2) format("woff2");font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#02030c}
#root{position:relative;width:1920px;height:1080px;overflow:hidden}
#gl{position:absolute;left:0;top:0;width:1920px;height:1080px}
#wash{position:absolute;inset:0;background:#02030c;opacity:0;z-index:10}
#grain{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:11;opacity:.35;object-fit:cover}
#logo{position:absolute;left:1799px;top:40px;width:81px;height:81px;z-index:12}
.cap{position:absolute;left:0;width:1920px;bottom:60px;display:flex;justify-content:center;opacity:0;z-index:13}
.cap span{font-family:Fredoka,sans-serif;font-weight:700;font-size:58px;line-height:54px;color:#fff;background:rgba(0,0,0,.62);border-radius:12px;padding:20px;white-space:nowrap}
#err{position:absolute;left:80px;top:80px;z-index:20;font:700 64px Fredoka;color:#ff5a5a;display:none}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080">
<canvas id="gl" width="1920" height="1080"></canvas>
<div id="wash"></div><img id="grain" src="grain.png"><img id="logo" src="logo.png"><div id="err">WEBGL UNAVAILABLE</div>
<div class="cap" id="c0"><span>Spacetime bends around a heavy mass.</span></div>
<div class="cap" id="c1"><span>Clocks deep in the well run slow.</span></div>
<div class="cap" id="c2"><span>A spinning black hole drags space with it.</span></div>
<audio src="mix.m4a" data-start="0" data-duration="20" data-track-index="0" data-volume="1"></audio>
</div>
<script>
// Miya's Lab 3D render test (2026-10-14). Everything is a pure function of the timeline time t (seek-safe):
// a GSAP tween drives a setter that redraws the WebGL scene, so any frame can be rendered in any order.
const T=THREE, W=1920, H=1080;
let R=null;
try{ R=new T.WebGLRenderer({canvas:document.getElementById('gl'),antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'}); }catch(e){ document.getElementById('err').style.display='block'; }
const GOLD=new T.Color('#ffc65a'), BLUE=new T.Color('#6f8cff'), NAVY=new T.Color('#0a1030'), PALE=new T.Color('#d6e4ff'), CORAL=new T.Color('#ff7a5a');
let render=()=>{};
if(R){
  R.setPixelRatio(1); R.setSize(W,H,false); R.toneMapping=T.ACESFilmicToneMapping; R.toneMappingExposure=1.05; R.outputColorSpace=T.SRGBColorSpace;
  const pm=new T.PMREMGenerator(R); const env=pm.fromScene(new RoomEnvironment(),0.04).texture;
  // ---------- scene A: cube field bent into a gravity well, chrome sphere with an orbit ring ----------
  const A=new T.Scene(); A.background=new T.Color('#02030c'); A.fog=new T.Fog('#02030c',40,95); A.environment=env;
  const NX=56, NZ=36, N=NX*NZ;
  const box=new T.BoxGeometry(.86,1,.86); box.translate(0,-.5,0);
  const mat=new T.MeshStandardMaterial({roughness:.55,metalness:.2,envMapIntensity:.12});
  const cubes=new T.InstancedMesh(box,mat,N); A.add(cubes);
  const base=[]; for(let i=0;i<NX;i++)for(let k=0;k<NZ;k++)base.push([(i-NX/2+.5),(k-NZ/2+.5)]);
  for(let n=0;n<N;n++) cubes.setColorAt(n,NAVY);
  const sphere=new T.Mesh(new T.SphereGeometry(2.2,96,64),new T.MeshStandardMaterial({color:'#ffffff',metalness:1,roughness:.08,envMapIntensity:1.4}));
  A.add(sphere);
  const ring=new T.Mesh(new T.TorusGeometry(3.6,.035,12,200),new T.MeshBasicMaterial({color:GOLD})); A.add(ring);
  const moon=new T.Mesh(new T.SphereGeometry(.28,32,24),new T.MeshStandardMaterial({color:BLUE,emissive:BLUE,emissiveIntensity:.6})); A.add(moon);
  A.add(new T.AmbientLight('#2a3278',.25));
  const key=new T.DirectionalLight('#d6e4ff',.55); key.position.set(-20,30,10); A.add(key);
  const pg=new T.PointLight('#ffc65a',420,30,1.7); A.add(pg);
  const pb=new T.PointLight('#6f8cff',180,60,1.4); pb.position.set(18,6,-12); A.add(pb);
  const camA=new T.PerspectiveCamera(38,W/H,.1,200);
  const M=new T.Matrix4(), Q=new T.Quaternion(), S=new T.Vector3(), P=new T.Vector3(), C=new T.Color();
  function drawA(t){
    const depth=Math.min(1,t/3.5)*9;                       // the well deepens over the first seconds
    for(let n=0;n<N;n++){
      const [x,z]=base[n]; const r2=x*x+z*z;
      const well=-depth/(1+r2/14);
      const wave=.55*Math.sin(.32*Math.sqrt(r2)-1.6*t)*Math.exp(-r2/900);
      const y=well+wave;
      P.set(x,y,z); S.set(1,1.2+Math.max(0,-well)*.15,1); M.compose(P,Q,S); cubes.setMatrixAt(n,M);
      const h=Math.min(1,Math.max(0,(-well)/9)); C.copy(NAVY).lerp(BLUE,Math.min(1,h*1.3)*.7).lerp(GOLD,Math.max(0,h-.5)*1.8);
      cubes.setColorAt(n,C);
    }
    cubes.instanceMatrix.needsUpdate=true; cubes.instanceColor.needsUpdate=true;
    const sy=2.6-depth*.62+.25*Math.sin(t*1.3); sphere.position.set(0,sy,0); sphere.rotation.y=t*.4;
    ring.position.copy(sphere.position); ring.rotation.set(1.15+.08*Math.sin(t*.7),0,.35+t*.25);
    const a=t*1.1; moon.position.set(sphere.position.x+3.6*Math.cos(a),sphere.position.y+3.6*Math.sin(a)*Math.sin(.42),3.6*Math.sin(a)*Math.cos(.42));
    pg.position.set(0,sy-1.5,0);
    const ca=-.6+t*.11, cr=34-t*1.1, ch=22-t*1.25;            // slow orbit + push-in, from high to low angle
    camA.position.set(Math.sin(ca)*cr,ch,Math.cos(ca)*cr); camA.lookAt(0,-1.5,0);
    R.render(A,camA);
  }
  // ---------- scene B: black hole with a particle accretion disk and lensed arc ----------
  const B=new T.Scene(); B.background=new T.Color('#02030c');
  const rnd=(s=>()=>{s=(s*16807)%2147483647;return s/2147483647})(12345);
  const sg=new T.BufferGeometry(); const sp=new Float32Array(3*2500);
  for(let i=0;i<2500;i++){const u=rnd()*2-1,th=rnd()*6.283,rr=150;sp.set([rr*Math.sqrt(1-u*u)*Math.cos(th),rr*u,rr*Math.sqrt(1-u*u)*Math.sin(th)],3*i);}
  sg.setAttribute('position',new T.BufferAttribute(sp,3)); B.add(new T.Points(sg,new T.PointsMaterial({color:PALE,size:1.4,sizeAttenuation:false,transparent:true,opacity:.8})));
  const hole=new T.Mesh(new T.SphereGeometry(3,64,48),new T.MeshBasicMaterial({color:'#000000'})); B.add(hole);
  const photon=new T.Mesh(new T.TorusGeometry(3.15,.06,12,200),new T.MeshBasicMaterial({color:'#fff2c8'})); B.add(photon);
  function diskTex(seed){ const c=document.createElement('canvas'); c.width=c.height=1024; const g=c.getContext('2d'); const r0=512;
    let q=seed; const rr=()=>{q=(q*16807)%2147483647;return q/2147483647};
    const grd=g.createRadialGradient(r0,r0,r0*.30,r0,r0,r0); grd.addColorStop(0,'rgba(255,246,220,0)'); grd.addColorStop(.02,'rgba(255,246,220,1)');
    grd.addColorStop(.18,'rgba(255,198,90,.95)'); grd.addColorStop(.5,'rgba(255,122,90,.55)'); grd.addColorStop(1,'rgba(255,122,90,0)');
    g.fillStyle=grd; g.beginPath(); g.arc(r0,r0,r0,0,6.283); g.arc(r0,r0,r0*.30,0,6.283,true); g.fill();
    g.globalCompositeOperation='lighter';
    for(let i=0;i<420;i++){ const r=r0*(.32+.66*Math.pow(rr(),1.3)), a=rr()*6.283, L=.3+rr()*1.2; g.strokeStyle=`rgba(255,${200+rr()*55|0},${150+rr()*90|0},${.05+rr()*.12})`;
      g.lineWidth=1+rr()*3; g.beginPath(); g.arc(r0,r0,r,a,a+L); g.stroke(); }
    const t=new T.CanvasTexture(c); t.colorSpace=T.SRGBColorSpace; return t; }
  const dmat=new T.MeshBasicMaterial({map:diskTex(7),transparent:true,blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide});
  const disk=new T.Mesh(new T.RingGeometry(3.4,13,256,1),dmat); disk.geometry.attributes.uv.array.forEach((v,i,a)=>{});
  // planar UVs of RingGeometry already map the 1024 canvas disk onto the ring
  B.add(disk);
  const lens=new T.Mesh(new T.RingGeometry(3.25,6.2,256,1),new T.MeshBasicMaterial({map:diskTex(11),transparent:true,opacity:.9,blending:T.AdditiveBlending,depthWrite:false}));
  B.add(lens);
  const glow=new T.Sprite(new T.SpriteMaterial({map:(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');const gr=g.createRadialGradient(128,128,0,128,128,128);
    gr.addColorStop(0,'rgba(255,198,90,.55)');gr.addColorStop(.5,'rgba(255,122,90,.18)');gr.addColorStop(1,'rgba(255,122,90,0)');g.fillStyle=gr;g.fillRect(0,0,256,256);return new T.CanvasTexture(c)})(),
    transparent:true,blending:T.AdditiveBlending,depthWrite:false})); glow.scale.set(30,30,1); B.add(glow);
  const camB=new T.PerspectiveCamera(40,W/H,.1,400);
  function drawB(t){
    const u=t-10;
    disk.rotation.set(-Math.PI/2+.10,0,0); disk.rotateZ(u*.35);
    const cd=30-u*1.1, ce=.22+.02*Math.sin(u*.5);
    camB.position.set(Math.sin(u*.05)*cd*.2,Math.sin(ce)*cd,Math.cos(ce)*cd); camB.lookAt(0,0,0);
    photon.lookAt(camB.position); lens.lookAt(camB.position); lens.rotateZ(-u*.2); glow.position.set(0,0,-2);
    R.render(B,camB);
  }
  render=t=>{ if(t<10) drawA(t); else drawB(t); };
}
// seek-safe driver: GSAP calls this setter whenever the timeline renders a time (play or seek)
let cur=-1; const drv={t(v){ if(v===undefined) return cur; cur=v; render(v); }};
const tl=gsap.timeline({paused:true});
tl.fromTo(drv,{t:0},{t:20,duration:20,ease:'none',immediateRender:true},0);
tl.fromTo('#wash',{opacity:0},{opacity:1,duration:.45,ease:'power1.in',immediateRender:false},9.55);
tl.to('#wash',{opacity:0,duration:.45,ease:'power1.out'},10.0);
[[0.4,4.6],[4.8,9.4],[10.6,19.2]].forEach(([a,b],i)=>{tl.set('#c'+i,{opacity:1},a);tl.set('#c'+i,{opacity:0},b);});
window.__timelines=window.__timelines||{};window.__timelines["main"]=tl;tl.seek(0);
</script></body></html>
