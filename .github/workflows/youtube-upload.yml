name: youtube-upload

# YouTube upload after miya's OK (2026-11-22). Render + Drive upload (render-chunked.yml) never upload to YouTube by themselves.
# After miya checked the rendered video on Drive and said OK, put one line "<video slug>" (the long-form slug, e.g. pluto-not-a-planet) in render/.upload
# and push to render-pipeline: the long video and its <slug>-short1..5 are uploaded to YouTube as private + scheduled (rules: docs/youtube-upload.md).
# Lines are idempotent (a title already on the channel is skipped), so old lines may stay. Comments only = nothing.
# Manual: Actions > youtube-upload > Run workflow (slugs = comma separated).
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'long-form slug(s), several separated by commas'
        required: true
  push:
    branches: [render-pipeline]
    paths: ["render/.upload", ".github/workflows/youtube-upload.yml"]

permissions:
  contents: read

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      ROOT_ID: 1lBexNbmVvKNahw56d-s2rUVR5Qp76V3i
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Build list
        id: l
        run: |
          if [ -n "${{ github.event.inputs.slugs }}" ]; then echo "${{ github.event.inputs.slugs }}" | tr ',' '\n' > spec.txt; else cp render/.upload spec.txt; fi
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, glob
          bases = [l.split()[0] for l in open('spec.txt') if l.strip() and not l.startswith('#')]
          rows = []
          for b in bases:
              for s in [b] + [f'{b}-short{i}' for i in range(1, 6)] + [f'{b}-short']:
                  if glob.glob(f'render/{s}/deliver/*_metadata.txt'): rows.append(dict(slug=s, n=1))
          print('slugs=' + json.dumps(rows)); print('count=' + str(len(rows)))
          EOF
          cat "$GITHUB_OUTPUT"
      - name: Upload to YouTube (private, scheduled)
        if: ${{ steps.l.outputs.count != '0' && env.YT_REFRESH_TOKEN != '' && env.RCLONE_CONF != '' }}
        env:
          SLUGS_JSON: ${{ steps.l.outputs.slugs }}
        run: |
          sudo apt-get update -y && sudo apt-get install -y rclone
          python3 -m pip install --quiet google-api-python-client google-auth
          mkdir -p ~/.config/rclone; printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          python3 tools/publish/yt_upload.py
