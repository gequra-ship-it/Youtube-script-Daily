name: Daily Auto Script (이과형)

on:
  schedule:
     - cron: '0 23 * * *' # 한국 시간 아침 8시 실행 (UTC 23:00)
  workflow_dispatch: # 수동으로 버튼 눌러서 실행하는 기능

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 💡 깃허브 봇이 새 대본 파일과 history.txt를 리포지토리에 저장할 수 있도록 권한 부여
    permissions:
      contents: write 

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          pip install google-genai google-api-python-client youtube-transcript-api

      - name: 🧹 유령 공백(NBSP) 자동 청소기 가동 (main2.py)
        run: python -c "text = open('main2.py', encoding='utf-8').read().replace('\xa0', ' '); open('main2.py', 'w', encoding='utf-8').write(text)"

      - name: 🚀 이과형 파이썬 대본 공장 가동!
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main2.py

      - name: 완성된 대본 깃허브에 자동 저장(업로드)
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Auto Bot"
          git add scripts/
          git commit -m "📝 오늘의 이과형 채널 대본 도착" || echo "변경된 내용이 없습니다."
          git push
