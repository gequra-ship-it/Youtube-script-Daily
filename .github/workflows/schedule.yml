name: Daily Auto Script

on:
  schedule:
    - cron: '0 23 * * *' # 한국 시간 기준 매일 아침 8시 실행 (UTC 23:00)
  workflow_dispatch: # 수동으로 버튼 눌러서 실행하는 기능

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 설치
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          pip install google-genai google-api-python-client

      - name: 파이썬 대본 공장 가동!
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: 완성된 대본 깃허브에 자동 저장(업로드)
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "Auto Bot"
          git add scripts/
          git commit -m "📝 오늘의 롱폼 대본 도착" || exit 0
          git push
