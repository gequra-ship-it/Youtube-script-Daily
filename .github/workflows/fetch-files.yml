name: fetch-files

# Download files (photos for photo-based scenes) on a GitHub runner and commit them to render-pipeline. Some image hosts
# block the cloud session's IP range; runners are not blocked. sheet=true commits only a numbered contact sheet
# (<out>/sheet.jpg) to choose from; otherwise every file is saved as <out>/<name>. Committing does not start a render.
on:
  workflow_dispatch:
    inputs:
      out: { description: 'output folder in the repo', required: true }
      files: { description: 'lines or ; separated "name url" pairs', required: true }
      sheet: { description: 'true = contact sheet only', required: false, default: 'false' }

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: render-pipeline }
      - run: pip install -q pillow
      - name: Download
        env:
          FILES: ${{ github.event.inputs.files }}
          OUT: ${{ github.event.inputs.out }}
          SHEET: ${{ github.event.inputs.sheet }}
        run: |
          python - <<'EOF'
          import os, urllib.request, io
          from PIL import Image, ImageDraw
          out = os.environ['OUT']; os.makedirs(out, exist_ok=True); sheet = os.environ['SHEET'] == 'true'
          pairs = [l.split(None, 1) for l in os.environ['FILES'].replace(';', '\n').splitlines() if l.strip()]
          ims = []
          for i, (name, url) in enumerate(pairs):
              try:
                  b = urllib.request.urlopen(urllib.request.Request(url.strip(), headers={'User-Agent': 'MiyaLab/1.0 (github actions)'}), timeout=60).read()
              except Exception as e:
                  print(name, 'failed', e); continue
              if sheet:
                  try: im = Image.open(io.BytesIO(b)).convert('RGB'); im.thumbnail((300, 200)); ims.append((i, name, im))
                  except Exception as e: print(name, 'not an image', e)
              else:
                  open(f'{out}/{name}', 'wb').write(b); print(name, len(b))
          if sheet:
              o = Image.new('RGB', (6 * 300, ((len(ims) + 5) // 6) * 220), 'white'); d = ImageDraw.Draw(o)
              for k, (i, name, im) in enumerate(ims):
                  o.paste(im, ((k % 6) * 300, (k // 6) * 220)); d.text(((k % 6) * 300 + 3, (k // 6) * 220 + 202), f'{i} {name}'[:46], fill='black')
              o.save(f'{out}/sheet.jpg', quality=85); print('sheet', len(ims))
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.out }}" && git commit -m "files: ${{ github.event.inputs.out }}" && git push origin HEAD:render-pipeline
