name: yt-stats

# Weekly YouTube stats (2026-11-20): per-video views / watch time / average view % -> stats/yt_stats_<date>.csv, committed to the branch it runs on.
# Scheduled runs only start from the default branch (main); manual: Actions > yt-stats > Run workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"   # Monday 00:00 UTC = 09:00 KST

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-24.04
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Collect stats
        if: ${{ env.YT_REFRESH_TOKEN != '' }}
        run: |
          python3 -m pip install --quiet google-api-python-client google-auth
          python3 tools/publish/yt_stats.py
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add stats; git diff --cached --quiet || { git commit -m "stats: weekly YouTube stats"; git push; }
